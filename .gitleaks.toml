title = "homelab"

[extend]
useDefault = true

[[rules]]
id = "age-private-key"
description = "Chave privada age (nunca deve sair de ~/.config/sops/age/keys.txt)"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["age-secret-key"]

[[rules]]
id = "tailnet-name"
description = "The tailnet name (*.ts.net) identifies the private network; it is discovered at runtime"
regex = '''[a-z0-9-]+\.ts\.net'''
keywords = ["ts.net"]

# CI test key: public on purpose (it only decrypts the hello-world demo).
# The sops-encrypted hook prevents it from being a recipient of any other file.
[[allowlists]]
description = "Public CI test age key"
targetRules = ["age-private-key", "age-secret-key", "generic-api-key"]
paths = ['''^tests/ci-age\.key$''']
