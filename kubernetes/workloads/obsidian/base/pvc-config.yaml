# App state (Obsidian configuration, Electron profile), on the laptop disk.
# The vault itself lives in the obsidian-vault PVC (kubernetes/workloads/obsidian/storage).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
