# Obsidian desktop in the browser (linuxserver/obsidian, Selkies on port 3000).
# The vault comes from the obsidian-vault PVC (NFS on the NAS; local-path in CI) and the app
# state (open vault, Electron profile) lives in /config, on the laptop disk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian
  annotations:
    # The image starts as root (s6-overlay fixes /config and switches to the PUID) and
    # writes to the rootfs; allowPrivilegeEscalation=false still applies (no sudo).
    ignore-check.kube-linter.io/run-as-non-root: "the linuxserver s6-overlay starts as root and switches to the PUID"
    ignore-check.kube-linter.io/no-read-only-root-fs: "s6-overlay and Selkies write to the rootfs"
spec:
  replicas: 1
  # RWO volumes: the new pod only starts after the old one releases the vault.
  strategy:
    type: Recreate
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: obsidian
          image: lscr.io/linuxserver/obsidian:v1.14.5-ls151@sha256:37716e2370ec8e3c6d0aa30f758bd0646916c64cd07d157c15ed8db856398eb1
          env:
            # Same owner as the NFS export all_squash (Bernardo:users).
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Sao_Paulo
            - name: TITLE
              value: borbsidian
          ports:
            - name: http
              containerPort: 3000
          # TCP, not HTTP: with basic auth (tailscale overlay) / answers 401.
          # Startup runs chown -R on /opt/obsidian (PUID != the image's 911), which on
          # overlayfs copies the whole app into the container layer: on the laptop
          # disk it takes over 1 min. The startupProbe holds the liveness off for up to 10 min.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: vault
              mountPath: /vaults/borbsidian
            # Electron needs a /dev/shm bigger than the default 64Mi (--shm-size=1gb).
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: obsidian-config
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-vault
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
