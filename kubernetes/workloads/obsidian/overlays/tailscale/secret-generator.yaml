# KSOPS: decrypts the files below while rendering (ArgoCD repo-server).
# In offline validation (pre-commit/CI) scripts/ksops-stub.py stands in for ksops.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: obsidian-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # CUSTOM_USER/PASSWORD: Selkies basic auth (see the README to read the password).
  - ./auth.sops.yaml
