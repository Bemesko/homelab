# immich-photos: External Library (read-only). immich-data: thumbnails,
# previews, transcodes and database backups. In base they live on local-path (CI).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
