# Immich PVCs, synced by the same Application that mounts them (local-path
# only binds the PVC when a pod uses it: WaitForFirstConsumer).
# base = CI (local-path); overlays/nas = NFS PVs on the NAS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
labels:
  - pairs:
      app.kubernetes.io/part-of: immich
resources:
  - pvcs.yaml
