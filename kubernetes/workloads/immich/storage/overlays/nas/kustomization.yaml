# Binds the PVCs to the NFS PVs created by Ansible (nas_storage role), which
# keep the NAS hostname and paths out of the repo. PVCs are immutable: switch from
# base to nas before the first sync (see the README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: immich-photos
    patch: |
      - op: replace
        path: /spec/accessModes
        value: [ReadOnlyMany]
      - op: replace
        path: /spec/storageClassName
        value: ""
      - op: add
        path: /spec/volumeName
        value: immich-photos
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Ti
  - target:
      kind: PersistentVolumeClaim
      name: immich-data
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: ""
      - op: add
        path: /spec/volumeName
        value: immich-data
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
