# Backups of the immich-database Postgres (docs/adr/014): base backup every day at 02:00 + WAL
# archiving to RustFS (s3://cnpg/immich/), 14-day point-in-time window. Only with the NAS:
# in CI there is no RustFS, so base stays as it is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ../../base
  - objectstore.yaml
  - scheduledbackup.yaml
generators:
  - secret-generator.yaml
patches:
  - target:
      kind: Cluster
      name: immich-database
    patch: |
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: immich-database-backup
