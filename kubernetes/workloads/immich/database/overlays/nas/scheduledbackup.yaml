# Daily base backup at 02:00, before the NAS replica rsync (03:00). No `immediate`: it fires
# while the Postgres pod still restarts to get the plugin sidecar and fails with "requested
# plugin is not available". WAL is archived from the start anyway.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-database-daily
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: immich-database
