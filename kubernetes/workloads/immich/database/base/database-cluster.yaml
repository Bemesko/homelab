# Based on local/cloudnative-pg.yaml from immich-charts 0.13.4.
# The vchord extension comes in as an image volume (ImageVolume is GA in k8s 1.37).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  annotations:
    # The CRD comes from the cloudnative-pg Application (wave 0).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  # Single node: a PDB would prevent draining the node itself.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  storage:
    # Laptop disk (local-path). The daily dumps go to the NAS (Immich backup).
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
