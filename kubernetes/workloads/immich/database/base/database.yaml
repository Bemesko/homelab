# Extensions required by Immich, created by the operator (superuser) in the "app" database.
# User/password/URI live in the immich-database-app Secret, generated by CNPG.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: app
  owner: app
  cluster:
    name: immich-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
