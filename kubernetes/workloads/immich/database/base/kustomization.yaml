# Immich database: CloudNativePG + VectorChord, on the laptop disk (local-path).
# The Immich PVCs live in ../storage, next to the Application that mounts them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
labels:
  - pairs:
      app.kubernetes.io/part-of: immich
resources:
  - database-cluster.yaml
  - database.yaml
