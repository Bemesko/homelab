# Laptop: https://casa.<your-tailnet>, with hostNetwork (mDNS/SSDP discovery on the LAN)
# and the host's D-Bus (Bluetooth through the laptop's BlueZ). CI uses base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: host-access.yaml
