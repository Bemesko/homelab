# https://casa.<your-tailnet>, with automatic Tailscale TLS. The proxy comes through the
# pod network (10.42.0.0/16), trusted in HA's HTTP settings (see configuration.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: home-assistant
      port:
        name: http
  tls:
    - hosts:
        - casa
