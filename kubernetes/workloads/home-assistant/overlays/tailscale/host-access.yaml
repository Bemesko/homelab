# Laptop only. It does not change the host network: the pod only listens on it.
# - hostNetwork: discovery (zeroconf/SSDP) uses multicast on the LAN; HA also
#   listens on <laptop IP>:8123 on the LAN.
# - /run/dbus (read-only): HA talks to the host's BlueZ (hci0 adapter).
# - NET_ADMIN/NET_RAW: Bluetooth (HCI) scanning and discovery through ping/DHCP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  annotations:
    ignore-check.kube-linter.io/host-network: "mDNS/SSDP discovery needs the host network"
    ignore-check.kube-linter.io/drop-net-raw-capability: "Bluetooth (HCI) and discovery need NET_RAW"
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: home-assistant
          securityContext:
            capabilities:
              drop: []
              add: [NET_ADMIN, NET_RAW]
          volumeMounts:
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
