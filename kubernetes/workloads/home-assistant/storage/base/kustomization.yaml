# The /config PVC, synced by the same Application that mounts it (local-path only
# binds the PVC when a pod uses it: WaitForFirstConsumer).
# base = CI (local-path); overlays/nas = NFS PV on the NAS (nas_storage role).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
labels:
  - pairs:
      app.kubernetes.io/part-of: home-assistant
resources:
  - pvc.yaml
