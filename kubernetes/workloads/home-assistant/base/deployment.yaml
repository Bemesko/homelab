# Home Assistant Container. configuration.yaml comes from Git (ConfigMap, subPath); the
# rest of /config (.storage: integrations, users and tokens created in the UI) lives in the
# home-assistant-config PVC (NFS on the NAS; local-path in CI). The history goes to
# Postgres (CNPG) through the recorder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "the official HA image runs as root (s6-overlay)"
    ignore-check.kube-linter.io/no-read-only-root-fs: "HA installs integration dependencies at runtime"
spec:
  replicas: 1
  # /config is RWO and HA does not support two instances on the same database.
  strategy:
    type: Recreate
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      # With the default ndots:5, external names (api.amazon.com) first go through the 4
      # search domains, in A and AAAA. HA's async resolver (c-ares) times out
      # on that uncached cascade and the Alexa Devices integration fails. With 2,
      # names with 2+ dots go straight out; internal ones use the FQDN (*.svc.cluster.local).
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      initContainers:
        # configuration.yaml includes these files, which the UI edits: creates them empty only
        # the first time (never overwrites what the UI saved).
        # Also deletes .ha_run.lock: HA removes it on shutdown, but a power outage
        # or the NAS going away kills the container without cleaning up, and the next start thinks there is
        # another instance ("Another Home Assistant instance is already running!", in a loop,
        # because the recorded PID matches another process in the new container). It is safe:
        # Recreate and RWO guarantee no other instance is using this /config.
        - name: init-includes
          image: ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
          command:
            - sh
            - -c
            - |
              [ -e /config/automations.yaml ] || echo '[]' > /config/automations.yaml
              [ -e /config/scenes.yaml ] || echo '[]' > /config/scenes.yaml
              [ -e /config/scripts.yaml ] || echo '{}' > /config/scripts.yaml
              rm -f /config/.ha_run.lock
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
          env:
            - name: TZ
              value: America/Sao_Paulo
            # Read in configuration.yaml with !env_var DB_URL (recorder).
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-database-app
                  key: uri
          ports:
            - name: http
              containerPort: 8123
          # /manifest.json answers 200 without login. The first boot installs the
          # dependencies of the default integrations (pip); on NFS it can take more than 5 min.
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-config
