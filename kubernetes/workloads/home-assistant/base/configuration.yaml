# Home Assistant configuration.yaml, versioned in Git (a ConfigMap mounted with
# subPath: editing through the UI does not work, change it here and push). Integrations
# configured through the UI (Alexa Devices, Bluetooth...) live in /config/.storage.
default_config:

homeassistant:
  name: Casa
  time_zone: America/Sao_Paulo
  country: BR
  language: pt-BR
  unit_system: metric
  currency: BRL

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# No http block: since 2026.8 HA keeps that config in /config/.storage/http and
# ignores the YAML; changes only take effect after being confirmed in the UI within 5 min of
# the restart. The Tailscale proxy ("casa" Ingress) comes through the pod network, so in
# Settings > System > Network > HTTP server: "Trust X-Forwarded-For" on and
# "Trusted proxies" = 10.42.0.0/16 (step by step in the README).

# History in Postgres (CNPG); DB_URL comes from the home-assistant-database-app Secret.
recorder:
  db_url: !env_var DB_URL
  purge_keep_days: 30
