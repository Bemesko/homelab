# base = CI (normal pod network, no Bluetooth, no Ingress).
# overlays/tailscale = laptop (hostNetwork, the host's D-Bus, https://casa.<your-tailnet>).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
labels:
  - pairs:
      app.kubernetes.io/name: home-assistant
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: home-assistant-config
    files:
      - configuration.yaml
