# Also the internal route for grocery-ops: http://home-assistant.home-assistant.svc:8123
# (with hostNetwork the endpoint becomes <node IP>:8123 and the Service keeps working).
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  selector: {}
  ports:
    - name: http
      port: 8123
      targetPort: http
