# Home Assistant recorder (history): CloudNativePG on the laptop disk (local-path).
# The HA /config lives in ../../storage, next to the Application that mounts it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
labels:
  - pairs:
      app.kubernetes.io/part-of: home-assistant
resources:
  - database-cluster.yaml
