# Daily base backup at 02:00, before the NAS replica rsync (03:00). immediate: the first
# one runs as soon as this is created.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-database-daily
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: home-assistant-database
