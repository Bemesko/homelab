apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: home-assistant-database-backup-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # home-assistant-database-s3: the RustFS user cnpg-home-assistant (same secret key as in kubernetes/workloads/rustfs).
  - ./s3.sops.yaml
