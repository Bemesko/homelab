# "app" database (owner "app") created by the default CNPG bootstrap; HA needs no
# extensions. User/password/URI live in the home-assistant-database-app Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-database
  annotations:
    # The CRD comes from the cloudnative-pg Application (wave 0).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  # Single node: a PDB would prevent draining the node itself.
  enablePDB: false
  # Same image as the Immich Postgres.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
