# KSOPS: decrypts the files below while rendering (ArgoCD repo-server).
# In offline validation (pre-commit/CI) scripts/ksops-stub.py stands in for ksops.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: rustfs-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # rustfs-root: RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY, the admin credentials.
  - ./root.sops.yaml
  # rustfs-cnpg-users: one key per Postgres cluster, named cnpg-<namespace>, whose value
  # is that user's secret key. The same value goes in the S3 credentials Secret next
  # to each cluster's ObjectStore.
  - ./cnpg-users.sops.yaml
