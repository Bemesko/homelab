# base = CI: local repository and test password. overlays/nas = laptop (Storage Box).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup
labels:
  - pairs:
      app.kubernetes.io/name: restic-backup
resources:
  - cronjob.yaml
configMapGenerator:
  - name: restic-backup-script
    files:
      - backup.sh
  # CI only: the nas overlay uses the "restic" Secret instead.
  - name: restic-ci
    literals:
      - RESTIC_REPOSITORY=/tmp/repo
      - RESTIC_PASSWORD=ci-test-only
