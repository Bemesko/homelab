# Laptop: backup of the NAS SSD root (backup-source PV, created by Ansible) to the Storage
# Box (infra/hetzner). The secret lives only here because CI does not decrypt secrets
# outside hello-world. RESTIC_REPOSITORY and known_hosts: `make backup-secret`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup
resources:
  - ../../base
  - pvc.yaml
generators:
  - secret-generator.yaml
patches:
  - target:
      kind: CronJob
      name: restic-backup
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/0
        value:
          name: config
          secret:
            secretName: restic
            defaultMode: 288  # 0440: group 100 (fsGroup) reads it; the script copies the key with 0600
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/1
        value:
          name: source
          persistentVolumeClaim:
            claimName: backup-source
            readOnly: true
  # The CI test ConfigMap is not used here.
  - target:
      kind: ConfigMap
      name: restic-ci
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: restic-ci
