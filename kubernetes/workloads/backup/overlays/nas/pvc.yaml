# Bound to the backup-source NFS PV (nas_storage role): root of the NAS SSD, read-only.
# A PVC is immutable: the name and volumeName do not change after the first sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-source
spec:
  storageClassName: ""
  volumeName: backup-source
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 1Ti
