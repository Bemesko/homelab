# Exposed on the tailnet as https://hello.<your-tailnet> with automatic Tailscale TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hello-world
      port:
        name: http
  tls:
    - hosts:
        - hello
