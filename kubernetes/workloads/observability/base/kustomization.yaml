# Grafana provisioning (alert rules and dashboards) read by the chart's sidecar.
# base = CI; overlays/tailscale = laptop (secrets, email and the "otel" Service on the tailnet).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
labels:
  - pairs:
      app.kubernetes.io/part-of: observability
resources:
  # Community dashboards (scripts/vendor-dashboards.sh) and our own.
  - dashboards
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_alert: "1"
configMapGenerator:
  - name: grafana-alert-rules
    files:
      - alerts/homelab.yaml
  - name: grafana-alert-rules-hosts
    files:
      - alerts/hosts.yaml
  - name: grafana-alert-rules-kubernetes
    files:
      - alerts/kubernetes.yaml
  - name: grafana-alert-rules-observability
    files:
      - alerts/observability.yaml
  - name: grafana-alert-rules-apps
    files:
      - alerts/apps.yaml
  - name: grafana-alert-rules-nas
    files:
      - alerts/nas.yaml
  - name: grafana-alert-rules-backup
    files:
      - alerts/backup.yaml
