# Grafana Alerting rules, loaded by the sidecar (grafana_alert label).
# Derived from community rules (source in each comment). The Kubernetes metrics
# follow the kube-state-metrics (kube_*) and cAdvisor (container_*) names, scraped by the
# otel-agent (docs/adr/013). Severities: critical and warning arrive by email; info only
# shows up in the UI (see the policy in overlays/tailscale/contact-points.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: kubernetes
    folder: Homelab
    interval: 1m
    rules:
      # Source: kubernetes-mixin, KubeNodeNotReady
      - uid: k8s-node-notready
        title: Kubernetes node NotReady
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                kube_node_status_condition{condition="Ready", status="true"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}

      # Source: kubernetes-mixin, KubePodNotReady
      - uid: k8s-pod-stuck
        title: Pod Pending or Unknown
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending/Unknown for 15 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: kubernetes-mixin, KubeContainerWaiting
      - uid: k8s-container-notready
        title: Container not ready
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) has been waiting for 15 min: {{ $labels.reason }}"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: kubernetes-mixin, KubeDeploymentReplicasMismatch
      - uid: k8s-deployment-mismatch
        title: Deployment with missing replicas
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: {{ $values.A.Value }} replica(s) unavailable"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, deployment) (kube_deployment_spec_replicas) - max by (namespace, deployment)
                (kube_deployment_status_replicas_available)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: kubernetes-mixin, KubeStatefulSetReplicasMismatch
      - uid: k8s-statefulset-mismatch
        title: StatefulSet with missing replicas
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.statefulset }}: {{ $values.A.Value }} replica(s) not ready"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, statefulset) (kube_statefulset_replicas) - max by (namespace, statefulset)
                (kube_statefulset_status_replicas_ready)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: kubernetes-mixin, KubeDaemonSetRolloutStuck
      - uid: k8s-daemonset-mismatch
        title: Incomplete DaemonSet
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.daemonset }}: {{ $values.A.Value }} node(s) without a ready pod"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled) - max by (namespace,
                daemonset) (kube_daemonset_status_number_ready)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: kubernetes-mixin, KubeJobFailed
      - uid: k8s-job-failed
        title: Job with failed pods
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.job_name }}: {{ $values.A.Value }} pod(s) failed"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, job_name) (kube_job_status_failed)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), ContainerHighMemoryUsage
      - uid: k8s-memory-near-limit
        title: Container near its memory limit
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.pod }} ({{ $labels.container }}) uses {{ humanizePercentage $values.A.Value }} of its limit"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod,
                container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.9]}
