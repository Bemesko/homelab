# Regras do Grafana Alerting, carregadas pelo sidecar (label grafana_alert).
# Derivadas de regras da comunidade (origem em cada comentário). As métricas do Kubernetes
# seguem os nomes do kube-state-metrics (kube_*) e do cAdvisor (container_*), raspados pelo
# otel-agent (docs/adr/013). Severidades: critical e warning chegam por e-mail; info só
# aparece na UI (veja a política em overlays/tailscale/contact-points.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: kubernetes
    folder: Homelab
    interval: 1m
    rules:
      # Origem: kubernetes-mixin, KubeNodeNotReady
      - uid: k8s-node-notready
        title: Nó do Kubernetes NotReady
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "O nó {{ $labels.node }} está NotReady"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                kube_node_status_condition{condition="Ready", status="true"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}

      # Origem: kubernetes-mixin, KubePodNotReady
      - uid: k8s-pod-stuck
        title: Pod Pending ou Unknown
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} está Pending/Unknown há 15 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: kubernetes-mixin, KubeContainerWaiting
      - uid: k8s-container-notready
        title: Container não pronto
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) está esperando há 15 min: {{ $labels.reason }}"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: kubernetes-mixin, KubeDeploymentReplicasMismatch
      - uid: k8s-deployment-mismatch
        title: Deployment com réplicas faltando
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: {{ $values.A.Value }} réplica(s) indisponível(is)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, deployment) (kube_deployment_spec_replicas) - max by (namespace, deployment)
                (kube_deployment_status_replicas_available)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: kubernetes-mixin, KubeStatefulSetReplicasMismatch
      - uid: k8s-statefulset-mismatch
        title: StatefulSet com réplicas faltando
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.statefulset }}: {{ $values.A.Value }} réplica(s) não pronta(s)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, statefulset) (kube_statefulset_replicas) - max by (namespace, statefulset)
                (kube_statefulset_status_replicas_ready)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: kubernetes-mixin, KubeDaemonSetRolloutStuck
      - uid: k8s-daemonset-mismatch
        title: DaemonSet incompleto
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.daemonset }}: {{ $values.A.Value }} nó(s) sem pod pronto"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled) - max by (namespace,
                daemonset) (kube_daemonset_status_number_ready)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: kubernetes-mixin, KubeJobFailed
      - uid: k8s-job-failed
        title: Job com pods falhados
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.job_name }}: {{ $values.A.Value }} pod(s) falharam"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, job_name) (kube_job_status_failed)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Origem: awesome-prometheus-alerts (CC BY 4.0), ContainerHighMemoryUsage
      - uid: k8s-memory-near-limit
        title: Container perto do limite de memória
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.pod }} ({{ $labels.container }}) usa {{ humanizePercentage $values.A.Value }} do limite"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod,
                container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.9]}
