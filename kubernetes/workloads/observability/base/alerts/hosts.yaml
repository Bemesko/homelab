# Grafana Alerting rules, loaded by the sidecar (grafana_alert label).
# Derived from community rules (source in each comment), rewritten for the
# OTel names that reach Prometheus over OTLP. Hosts are told apart by host_name
# (service.name becomes the job label). Severities: critical and warning arrive by email;
# info only shows up in the UI (see the policy in overlays/tailscale/contact-points.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: Homelab
    interval: 1m
    rules:
      # Source: awesome-prometheus-alerts (CC BY 4.0), HostOutOfDiskSpace
      - uid: host-disk-critical
        title: Root disk above 95%
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host_name }}: disk / at {{ humanizePercentage $values.A.Value }} used"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (host_name) (system_filesystem_usage_bytes{mountpoint="/", state="used"}) / sum by
                (host_name) (system_filesystem_usage_bytes{mountpoint="/"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.95]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostUnusualDiskIo. Laptop only:
      # the NAS USB stick is always busy. Incident of 2026-11-11 (ADR 010):
      # unattended-upgrades kept the SSD 84% busy and stalled the cluster's SQLite databases.
      - uid: host-disk-saturated
        title: Laptop disk saturated
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: {{ $labels.device }} busy {{ humanizePercentage $values.A.Value }} of the time"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (host_name, device) (rate(system_disk_io_time_seconds_total{job="homelab-host",
                device=~"sd[a-z]|nvme[0-9]+n[0-9]+"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.7]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostDiskWillFillIn24Hours
      - uid: host-disk-fill-24h
        title: Root disk fills up in 24h
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: at the rate of the last 6h, disk / fills up in 24h"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                predict_linear(sum by (host_name) (system_filesystem_usage_bytes{mountpoint="/",
                state="free"})[6h:5m], 86400)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostOutOfInodes
      - uid: host-inodes-low
        title: Inodes below 10%
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }} {{ $labels.mountpoint }}: only {{ humanizePercentage $values.A.Value }} of inodes free"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (host_name, mountpoint) (system_filesystem_inodes_usage{state="free"}) / sum by (host_name,
                mountpoint) (system_filesystem_inodes_usage)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0.1]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostHighCpuLoad
      - uid: host-cpu-high
        title: CPU above 90%
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: CPU at {{ humanizePercentage $values.A.Value }} for 30 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                1 - sum by (host_name) (rate(system_cpu_time_seconds_total{state="idle"}[5m])) / sum by (host_name)
                (rate(system_cpu_time_seconds_total[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.9]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostSwapIsFillingUp
      - uid: host-swap-high
        title: Swap above 80%
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: swap at {{ humanizePercentage $values.A.Value }}"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (host_name) (system_paging_usage_bytes{state="used"}) / sum by (host_name)
                (system_paging_usage_bytes)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}

      # Source: same design as the nas-silent alert
      - uid: host-silent
        title: Laptop without metrics
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The laptop has not sent metrics for 10 minutes (the host collector stopped or the gateway does not answer)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(system_cpu_load_average_1m{job="homelab-host"}[10m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Own (issue #32): the control node (Raspberry Pi) writes every Ansible run to its journal as
      # homelab-ansible; the PLAY RECAP lines carry failed=N and unreachable=N per host.
      - uid: control-node-apply-failed
        title: Ansible run failed on the control node
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "A playbook run on the control node ended with failed or unreachable hosts in the last 15 min"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service_name="control-node"} |= `"SYSLOG_IDENTIFIER":"homelab-ansible"`
                |~ `(failed|unreachable)=[1-9]` [15m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: same design as host-silent, for the control node (its own job, see group_vars/control_node.yaml)
      - uid: control-node-silent
        title: Control node without metrics
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The control node has not sent metrics for 10 minutes (the host collector stopped, the Pi is down or the gateway does not answer)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(system_cpu_load_average_1m{job="control-node"}[10m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Own (ADR 012): homelab-power-guard logs the switch to battery. Without power the
      # laptop shuts down at 10%; the warning gives time to act before that.
      - uid: host-on-battery
        title: Laptop on battery (no external power)
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service_name }}: external power lost in the last 10 min; it shuts down by itself on low battery"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              # Filter by the program that wrote the line, not only by its text: on 2026-11-20 an
              # Ansible ad-hoc command mentioning the phrase (logged by the NAS syslog) fired it.
              # Laptop: journald JSON body; NAS: OMV syslog, where the tag becomes appname.
              expr: >-
                sum by (service_name) (count_over_time({service_name="homelab-host"}
                |= `"SYSLOG_IDENTIFIER":"homelab-power"` |= "external power lost" [10m]))
                or sum by (service_name) (count_over_time({service_name="nas-host"}
                | appname="homelab-power" |= "external power lost" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), HostOomKillDetected (via logs)
      - uid: host-oom-kill
        title: OOM kill on the host
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service_name }}: the kernel killed processes for lack of memory in the last 10 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum by (service_name) (count_over_time({service_name=~"homelab-host|nas-host"} |= "Out of memory:
                Killed process" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
