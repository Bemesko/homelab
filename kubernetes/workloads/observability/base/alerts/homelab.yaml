# Grafana Alerting rules, loaded by the sidecar (grafana_alert label).
# Metrics arrive over OTLP: the names follow the Prometheus translation
# (system.filesystem.usage -> system_filesystem_usage_bytes). Hosts are
# identified by service.name: homelab-host (otel_host_agent) and nas-host (NAS),
# which becomes the job label in Prometheus and service_name in Loki.
apiVersion: 1
groups:
  - orgId: 1
    name: homelab
    folder: Homelab
    interval: 1m
    rules:
      - uid: host-disk-full
        title: Root disk above 85%
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: disk / at {{ humanizePercentage $values.A.Value }} used"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (host_name) (system_filesystem_usage_bytes{mountpoint="/", state="used"})
                / sum by (host_name) (system_filesystem_usage_bytes{mountpoint="/"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.85]}

      - uid: host-memory-low
        title: Available memory below 10%
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host_name }}: only {{ humanizePercentage $values.A.Value }} of memory available"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (host_name) (system_memory_usage_bytes{state=~"free|cached|buffered|slab_reclaimable"})
                / sum by (host_name) (system_memory_usage_bytes)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0.10]}

      - uid: pod-restarting
        title: Container restarting
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $values.A.Value }}x in 30 min"
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, pod, container)
                (increase(kube_pod_container_status_restarts_total[30m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [2]}

      - uid: argocd-app-unhealthy
        title: ArgoCD Application not Healthy
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Application {{ $labels.name }} is {{ $labels.health_status }}"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: count by (name, health_status) (argocd_app_info{health_status!="Healthy"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Would have caught the 11/05 incident: stuck connections filled max_connections.
      - uid: postgres-connections-high
        title: Postgres near max_connections
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.pod }}: {{ humanizePercentage $values.A.Value }} of the connections in use"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (pod) (cnpg_backends_total)
                / max by (pod) (cnpg_pg_settings_setting{name="max_connections"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}

      - uid: nas-silent
        title: NAS without metrics
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: The NAS has not sent metrics for 10 minutes (powered off, no network or the collector stopped)
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent_over_time(system_cpu_load_average_1m{job="nas-host"}[10m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Would have caught the 11/05 incident: the kernel denying signals inside the containers.
      - uid: host-apparmor-denied
        title: AppArmor denying signals on the host
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.A.Value }} AppArmor signal denials in the last 10 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({service_name="homelab-host"}
                |= "apparmor=\"DENIED\"" |= "operation=\"signal\"" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
