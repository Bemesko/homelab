# Grafana Alerting rules, loaded by the sidecar (grafana_alert label).
# Derived from community rules (source in each comment), rewritten for the
# OTel names that reach Prometheus over OTLP. Hosts are told apart by host_name
# (service.name becomes the job label). Severities: critical and warning arrive by email;
# info only shows up in the UI (see the policy in overlays/tailscale/contact-points.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: observability
    folder: Homelab
    interval: 1m
    rules:
      # Source: Watchdog / PrometheusNotIngestingSamples. absent_over_time returns 1 only when the
      # metric disappears and empty when it exists: "no data" is the healthy state (noDataState OK).
      # The sentinel is the otel-agent's own telemetry, which takes the same path
      # (agent -> gateway -> Prometheus) and does not depend on the Kubernetes metrics.
      - uid: pipeline-dead
        title: No cluster metrics arriving
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Nothing reached Prometheus in the last 5 min: the otel-agent, the otel-gateway or Prometheus stopped"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(otelcol_process_uptime_seconds_total{job="observability/otel-agent"}[5m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # kube-state-metrics feeds the alerts in kubernetes.yaml and OpenCost: without it,
      # those rules stay in "no data" (OK state) and warn about nothing.
      - uid: kube-state-metrics-missing
        title: kube-state-metrics without data
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: "kube-state-metrics has not sent metrics for 10 min: the Kubernetes alerts and OpenCost are blind"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(kube_node_info[10m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), PrometheusTargetMissing
      - uid: scrape-target-down
        title: Scrape target down
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) does not answer the otel-agent scrape"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                1 - up{job=~"(.+/)?(argocd.*|cnpg|immich.*|loki|tempo|prometheus|coredns)"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts, OpenTelemetry Collector, ExporterFailed*
      - uid: otel-export-failed
        title: Collector failing to export
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: exporter {{ $labels.exporter }} is failing"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                label_replace(sum by (job, exporter) (rate(otelcol_exporter_send_failed_log_records_total[5m])),
                "signal", "logs", "", "") or label_replace(sum by (job, exporter)
                (rate(otelcol_exporter_send_failed_metric_points_total[5m])), "signal", "metrics", "", "") or
                label_replace(sum by (job, exporter) (rate(otelcol_exporter_send_failed_spans_total[5m])), "signal",
                "traces", "", "")
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts, OpenTelemetry Collector, ExporterEnqueueFailed*
      - uid: otel-data-dropped
        title: Collector dropping data
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }}: the queue of exporter {{ $labels.exporter }} is dropping data"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                label_replace(sum by (job, exporter) (rate(otelcol_exporter_enqueue_failed_log_records_total[5m])),
                "signal", "logs", "", "") or label_replace(sum by (job, exporter)
                (rate(otelcol_exporter_enqueue_failed_metric_points_total[5m])), "signal", "metrics", "", "") or
                label_replace(sum by (job, exporter) (rate(otelcol_exporter_enqueue_failed_spans_total[5m])),
                "signal", "traces", "", "")
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts, OpenTelemetry Collector, ExporterQueueNearlyFull
      - uid: otel-queue-full
        title: Exporter queue nearly full
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: the queue of exporter {{ $labels.exporter }} is at {{ humanizePercentage $values.A.Value }}"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (job, exporter) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}

      # Source: awesome-prometheus-alerts, OpenTelemetry Collector, ReceiverRefused*
      - uid: otel-receiver-refused
        title: Collector refusing data
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: receiver {{ $labels.receiver }} refuses data (memory_limiter?)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                label_replace(sum by (job, receiver) (rate(otelcol_receiver_refused_log_records_total[5m])),
                "signal", "logs", "", "") or label_replace(sum by (job, receiver)
                (rate(otelcol_receiver_refused_metric_points_total[5m])), "signal", "metrics", "", "") or
                label_replace(sum by (job, receiver) (rate(otelcol_receiver_refused_spans_total[5m])), "signal",
                "traces", "", "")
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), Prometheus self-monitoring (4 rules)
      - uid: prometheus-tsdb-failing
        title: Prometheus TSDB failures
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Prometheus logged {{ $values.A.Value }} compaction, WAL or truncation failure(s) in the last hour"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(prometheus_tsdb_compactions_failed_total[1h])) +
                sum(increase(prometheus_tsdb_wal_corruptions_total[1h])) +
                sum(increase(prometheus_tsdb_head_truncations_failed_total[1h])) +
                sum(increase(prometheus_tsdb_reloads_failures_total[1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), LokiRequestErrors
      - uid: loki-request-errors
        title: Loki returning 5xx errors
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanizePercentage $values.A.Value }} of the Loki requests return 5xx"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) /
                sum(rate(loki_request_duration_seconds_count[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.1]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), LokiRequestPanic
      - uid: loki-panic
        title: Loki panicked
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Loki logged {{ $values.A.Value }} panic(s) in the last 10 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(loki_panic_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), TempoCompactionsFailing
      - uid: tempo-compaction-failing
        title: Tempo compaction failing
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Tempo failed compaction {{ $values.A.Value }}x in the last hour"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(tempodb_compaction_errors_total[1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [2]}
