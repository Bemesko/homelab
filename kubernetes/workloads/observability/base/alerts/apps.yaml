# Grafana Alerting rules, loaded by the sidecar (grafana_alert label).
# Derived from community rules (source in each comment), rewritten for the
# OTel names that reach Prometheus over OTLP. Hosts are told apart by host_name
# (service.name becomes the job label). Severities: critical and warning arrive by email;
# info only shows up in the UI (see the policy in overlays/tailscale/contact-points.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: apps
    folder: Homelab
    interval: 1m
    rules:
      # Source: awesome-prometheus-alerts (CC BY 4.0), ArgocdServiceNotSynced
      - uid: argocd-app-outofsync
        title: ArgoCD Application out of sync
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Application {{ $labels.name }} has been {{ $labels.sync_status }} for 30 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                count by (name, sync_status) (argocd_app_info{sync_status!="Synced"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Source: cloudnative-pg/charts, cluster-offline rule (cluster-v0.9.0)
      - uid: cnpg-instance-down
        title: Postgres (CNPG) instance down
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }}: Postgres does not answer the CNPG exporter"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                min by (namespace, pod) (cnpg_collector_up)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), PostgresqlTooManyLocksAcquired / XID wraparound
      - uid: postgres-xid-age
        title: High Postgres XID age
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.datname }}: XID age at {{ $values.A.Value }} (wraparound is near)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (namespace, datname) (cnpg_pg_database_xid_age)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [1500000000]}

      # Source: awesome-prometheus-alerts (CC BY 4.0), PostgresqlDeadLocks
      - uid: postgres-deadlocks
        title: Postgres deadlocks
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.datname }}: {{ $values.A.Value }} deadlocks in 10 min"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (namespace, datname) (increase(cnpg_pg_stat_database_deadlocks_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5]}
