# NAS capacity rules: disk purchase checkpoints, not just "disk full".
# Setup: primary SSD (data-with-backup + data-without-backup) and a replica SSD over
# USB, which only holds the copy of data-with-backup. So the replica usage is the size
# of the backup. The nas_role label (primary/replica) comes from the NAS collector
# (hosts/nas/otel-collector/compose.yaml), which matches the mountpoint against NAS_PRIMARY_MOUNT
# and NAS_REPLICA_MOUNT from the stack's .env: the NAS paths do not live in the repo.
# Usage = used / (used + free), like df: the ext4 reserved space does not count.
# Exclusive bands (expr with "<" at the top): each level fires on its own, without repeating
# the one below.
apiVersion: 1
groups:
  - orgId: 1
    name: nas
    folder: Homelab
    interval: 5m
    rules:
      - uid: nas-replica-plan
        title: Backup replica above 70%
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: >-
            Replica at {{ humanizePercentage $values.A.Value }}: start researching the larger backup
            disk (3.5" HDD with its own power supply) or review what is in data-with-backup
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica",
                state=~"used|free"}) < 0.85
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.7]}

      - uid: nas-replica-buy
        title: Backup replica above 85%
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            Replica at {{ humanizePercentage $values.A.Value }}: time to buy the larger backup disk
            (a entrega pode levar semanas)
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica",
                state=~"used|free"}) < 0.95
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.85]}

      - uid: nas-replica-full
        title: Backup replica above 95%
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: >-
            Replica at {{ humanizePercentage $values.A.Value }}: the next backup may fail; stop
            putting things in data-with-backup until the new disk arrives
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="replica",
                state=~"used|free"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.95]}

      - uid: nas-primary-plan
        title: NAS primary disk above 80%
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: >-
            Primary at {{ humanizePercentage $values.A.Value }}: plan the HDD in the UltraBay caddy
            to move data-without-backup off the SSD
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary",
                state=~"used|free"}) < 0.9
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}

      - uid: nas-primary-buy
        title: NAS primary disk above 90%
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Primary at {{ humanizePercentage $values.A.Value }}: time to buy the HDD and the UltraBay caddy"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary",
                state=~"used|free"}) < 0.95
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.9]}

      - uid: nas-primary-full
        title: NAS primary disk above 95%
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: >-
            Primary at {{ humanizePercentage $values.A.Value }}: Immich and the uploads will fail
            soon; free up space in data-without-backup
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary", state="used"})
                / sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host", nas_role="primary",
                state=~"used|free"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.95]}

      # Buy ahead of time: a large import fills it quickly and delivery takes
      # weeks. Trend of the last 7 days (Prometheus retention is 30d).
      - uid: nas-disk-fill-90d
        title: NAS disk fills up in 3 months
        condition: B
        for: 6h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.nas_role }}: at the rate of the last 7 days, the disk fills up in less than 3 months"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                predict_linear(sum by (nas_role) (system_filesystem_usage_bytes{job="nas-host",
                nas_role=~"primary|replica", state="free"})[7d:1h], 90 * 86400)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0]}

      # The replica SSD already dropped once with "error -71" on USB. It only alerts if the NAS
      # is sending metrics (nas-silent covers the NAS being down). It also fires
      # if NAS_REPLICA_MOUNT is not in the stack's .env.
      - uid: nas-replica-missing
        title: NAS replica disk missing
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            The replica filesystem has been missing from the metrics for 30 min (disconnected, not mounted or
            wrong NAS_REPLICA_MOUNT): the backups are not happening
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(system_filesystem_usage_bytes{job="nas-host", nas_role="replica"}[30m]) and on ()
                count(present_over_time(system_cpu_load_average_1m{job="nas-host"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # USB protocol error (cable, case or power): it is what took the replica down.
      # The OMV rsyslog forwards *.* and the kernel messages arrive with
      # appname=kernel (checked on 2026-11-08).
      - uid: nas-usb-error
        title: USB error on the NAS
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            {{ $values.A.Value }} USB errors (error -71) on the NAS in the last 10 min: replace the cable or the
            case before suspecting the disk
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service_name="nas-host"} | appname="kernel" |= "error -71" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # --- Replication (OMV Rsync tasks; log in service_name=nas-rsync) ---
      # Every run that ends well writes "total size is ..." (rsync_event=summary).
      # The tasks run every day at 03:00: 26h without a summary = a missed replica.
      - uid: nas-rsync-stale
        title: NAS replica without a successful run in 26h
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            No Rsync task finished successfully in the last 26h: the data-with-backup backup
            is out of date (see the logs of service_name=nas-rsync and nas-host)
        data:
          - refId: A
            relativeTimeRange: {from: 93600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: absent_over_time({service_name="nas-rsync"} | rsync_event="summary" [26h])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: nas-rsync-error
        title: NAS Rsync task finished with an error
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            The replica rsync logged {{ $values.A.Value }} error(s) in the last hour (the code is in the
            rsync_exit_code attribute; 23 = files not copied, 11/12 = disk or connection)
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service_name="nas-rsync"} | rsync_event="error" [1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # The task script (generated by OMV) aborts before rsync if the source or the
      # destination is not mounted, and logs to syslog with the rsync-<uuid> tag.
      - uid: nas-rsync-skipped
        title: NAS Rsync task did not run
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            The OMV Rsync task aborted in the last hour (usually a source or replica disk not
            mounted): see the logs of service_name=nas-host with appname rsync-*
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service_name="nas-host"} | appname=~"rsync-.*" [1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # --- SMART (smartctl-exporter on the NAS, scraped by the collector) ---
      # The `device` label (sda, sdb) is the kernel's detection order and changes when a disk switches
      # connection (it happened on 2026-11-17, when the replica moved from USB to the UltraBay). So
      # the rules join the disk model and serial (smartctl_device series, value 1) and group
      # by them. In the delta rules, the join sits inside a [1d:5m] subquery: the serial
      # is resolved at each step, and the delta survives a change of letters without breaking.
      - uid: nas-smart-failed
        title: NAS disk failed SMART
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.model_name }} ({{ $labels.serial_number }}): the disk itself reports a SMART failure; replace it and check the replica"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                min by (serial_number, model_name) (smartctl_device_smart_status{job="nas-host"} * on (instance, device)
                group_left (serial_number, model_name) smartctl_device{job="nas-host"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}

      # Counters that only go up when the media fails: any increase in 24h counts.
      - uid: nas-smart-errors-growing
        title: Media errors increasing on a NAS disk
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            {{ $labels.model_name }} ({{ $labels.serial_number }}): {{ $labels.attribute_name }} went up by {{ $values.A.Value }} in 24h;
            plan the disk replacement
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (serial_number, model_name, attribute_name) (delta((max by (serial_number, model_name, attribute_name)
                (smartctl_device_attribute{job="nas-host", attribute_value_type="raw",
                attribute_name=~"Reallocated_.*|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect|Program_Fail_Count|Erase_Fail_Count|Runtime_Bad_Block"}
                * on (instance, device) group_left (serial_number, model_name) smartctl_device{job="nas-host"}))[1d:5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # CRC goes up because of a problem in the path (SATA connector, cable, USB bridge), not the media.
      - uid: nas-smart-crc-growing
        title: CRC errors increasing on a NAS disk
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: >-
            {{ $labels.model_name }} ({{ $labels.serial_number }}): {{ $labels.attribute_name }} went up by {{ $values.A.Value }} in 24h;
            check the connector, the cable or the case before blaming the disk
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (serial_number, model_name, attribute_name) (delta((max by (serial_number, model_name, attribute_name)
                (smartctl_device_attribute{job="nas-host", attribute_value_type="raw",
                attribute_name=~"SATA_CRC_Error_Count|UDMA_CRC_Error_Count|CRC_Error_Count"}
                * on (instance, device) group_left (serial_number, model_name) smartctl_device{job="nas-host"}))[1d:5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      # Normalized remaining life (100 = new). 20% = 80% wear: time to replace it.
      - uid: nas-ssd-wear
        title: NAS SSD with less than 20% life left
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.model_name }} ({{ $labels.serial_number }}): SSD remaining life at {{ $values.A.Value }}%; buy the replacement"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                min by (serial_number, model_name) (smartctl_device_attribute{job="nas-host", attribute_value_type="value",
                attribute_name=~"SSD_Life_Left|Percent_Lifetime_Remain|Wear_Leveling_Count|Media_Wearout_Indicator|Remaining_Lifetime_Perc"}
                * on (instance, device) group_left (serial_number, model_name) smartctl_device{job="nas-host"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [20]}

      - uid: nas-disk-temp
        title: NAS disk above 60 °C
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.model_name }} ({{ $labels.serial_number }}): {{ $values.A.Value }} °C for 30 min"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max by (serial_number, model_name) (smartctl_device_temperature{job="nas-host", temperature_type="current"}
                * on (instance, device) group_left (serial_number, model_name) smartctl_device{job="nas-host"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [60]}

      # The NAS sends metrics, but no SMART: smartctl-exporter stopped or did not start.
      - uid: nas-smart-missing
        title: NAS SMART without data
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: "The NAS has not sent SMART for 30 min: check the smartctl-exporter container in the OMV stack"
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(smartctl_device_smart_status{job="nas-host"}[30m]) and on ()
                count(present_over_time(system_cpu_load_average_1m{job="nas-host"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
