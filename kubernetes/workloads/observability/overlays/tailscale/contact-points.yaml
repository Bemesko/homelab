# Email contact point and default policy (sidecar, label grafana_alert).
# The recipient comes from the grafana-smtp Secret (env ALERT_EMAIL_TO): no email address in the repo.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-homelab
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true
# Interval covering the whole day: a route with mute_time_intervals: [always]
# never notifies (the alert stays visible in the Grafana UI).
muteTimes:
  - orgId: 1
    name: always
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"
policies:
  - orgId: 1
    receiver: email
    group_by: [grafana_folder, alertname]
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 12h
    # critical and warning arrive by email at different paces; info only shows in the UI.
    routes:
      - receiver: email
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 30s
        repeat_interval: 4h
      - receiver: email
        object_matchers:
          - ["severity", "=", "warning"]
        group_interval: 30m
        repeat_interval: 24h
      - receiver: email
        object_matchers:
          - ["severity", "=", "info"]
        mute_time_intervals: [always]
