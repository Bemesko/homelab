# OTLP entry point for whatever is outside the cluster (otel_host_agent on the hosts,
# the NAS collector): the otel-gateway exposed on the tailnet as "otel".
apiVersion: v1
kind: Service
metadata:
  name: otel
  annotations:
    tailscale.com/hostname: otel
    ignore-check.kube-linter.io/dangling-service: "the pods come from the otel-gateway release (chart), outside this kustomize"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-gateway
    component: standalone-collector
  ports:
    - name: otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
