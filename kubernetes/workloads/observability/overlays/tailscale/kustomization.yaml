# Laptop: Grafana secrets (admin and SMTP), the email contact point and the
# otel-gateway on the tailnet. The Grafana Ingress comes from the chart (Application template).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ../../base
  - otel-service.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: grafana-contact-points
    files:
      - contact-points.yaml
    options:
      disableNameSuffixHash: true
      labels:
        grafana_alert: "1"
