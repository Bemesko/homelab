# KSOPS: decrypts the files below while rendering (ArgoCD repo-server).
# In offline validation (pre-commit/CI) scripts/ksops-stub.py stands in for ksops.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: observability-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # Grafana admin-user/admin-password.
  - ./grafana-admin.sops.yaml
  # GF_SMTP_* (Gmail + app password) and ALERT_EMAIL_TO; see the README.
  - ./grafana-smtp.sops.yaml
