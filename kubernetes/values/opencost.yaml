# Values for the opencost chart, version in kubernetes/apps/values.yaml. Cost per namespace,
# pod and node from the cluster's Prometheus (cAdvisor + kube-state-metrics, both
# scraped by the otel-agent). See docs/adr/013.
#
# Prices: those from OpenCost's default.json (see customPricing below). The absolute values
# are a cloud reference, not the laptop's real cost; what matters is the proportion between
# apps. The exporter and UI images come with digests in the chart itself.
opencost:
  # MCP server (port 8081): we do not run AI agents against OpenCost.
  mcp:
    enabled: false
  exporter:
    defaultClusterId: homelab
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Both images already run as 1001. No readOnlyRootFilesystem: the exporter and the UI
    # nginx write to paths the chart does not mount (cache and config).
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  # Without customPricing the exporter only emits the PV cost, no node_*_hourly_cost (the log
  # says "No pricing found for key=default"). These are the values from OpenCost's own
  # default.json (GCP us-central1 reference, USD per hour). The chart ships other
  # examples (CPU 1.25, storage 0.25), which are not the OpenCost defaults.
  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: OpenCost reference prices (GCP us-central1)
      CPU: "0.031611"
      spotCPU: "0.006655"
      RAM: "0.004237"
      spotRAM: "0.000892"
      GPU: "0.95"
      storage: "0.00005479452"
      zoneNetworkEgress: "0.01"
      regionNetworkEgress: "0.01"
      internetNetworkEgress: "0.12"
  prometheus:
    internal:
      enabled: true
      serviceName: prometheus-server
      namespaceName: observability
      port: 80
  metrics:
    kubeStateMetrics:
      # Only the v1 metrics that kube-state-metrics 2 does not have (the rest already exists).
      emitKsmV1Metrics: true
      emitKsmV1MetricsOnly: true
  ui:
    enabled: true
    # The cluster is IPv4 (the UI nginx would listen on [::] for no reason).
    useIPv6: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
