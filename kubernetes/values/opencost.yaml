# Values do chart opencost, versão em kubernetes/apps/values.yaml. Custo por namespace,
# pod e nó a partir do Prometheus do cluster (cAdvisor + kube-state-metrics, ambos
# raspados pelo otel-agent). Veja docs/adr/013.
#
# Preços: os do default.json do OpenCost (veja customPricing abaixo). Os valores absolutos
# são uma referência de nuvem, não o custo real do notebook; o que vale é a proporção entre
# os apps. As imagens do exporter e da UI vêm com digest no próprio chart.
opencost:
  # Servidor MCP (porta 8081): não usamos agentes de IA contra o OpenCost.
  mcp:
    enabled: false
  exporter:
    defaultClusterId: homelab
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
    # As duas imagens já rodam como 1001. Sem readOnlyRootFilesystem: o exporter e o nginx
    # da UI gravam em caminhos que o chart não monta (cache e config).
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  # Sem customPricing o exporter só emite o custo de PV, nenhum node_*_hourly_cost (o log
  # mostra "No pricing found for key=default"). Estes são os valores do default.json do
  # próprio OpenCost (referência GCP us-central1, USD por hora). O chart traz outros
  # exemplos (CPU 1.25, storage 0.25), que não são os padrões do OpenCost.
  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: Precos de referencia do OpenCost (GCP us-central1)
      CPU: "0.031611"
      spotCPU: "0.006655"
      RAM: "0.004237"
      spotRAM: "0.000892"
      GPU: "0.95"
      storage: "0.00005479452"
      zoneNetworkEgress: "0.01"
      regionNetworkEgress: "0.01"
      internetNetworkEgress: "0.12"
  prometheus:
    internal:
      enabled: true
      serviceName: prometheus-server
      namespaceName: observability
      port: 80
  metrics:
    kubeStateMetrics:
      # Só as métricas v1 que o kube-state-metrics 2 não tem (o resto já existe).
      emitKsmV1Metrics: true
      emitKsmV1MetricsOnly: true
  ui:
    enabled: true
    # O cluster é IPv4 (o nginx da UI escutaria em [::] sem necessidade).
    useIPv6: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
