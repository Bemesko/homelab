# Values for the immich chart (OCI ghcr.io/immich-app/immich-charts, version in kubernetes/apps/values.yaml).
# The database (CNPG) and the PVCs come from kubernetes/workloads/immich; the "fotos" Ingress is
# added in kubernetes/apps/templates/immich.yaml when Tailscale is on.
controllers:
  main:
    containers:
      main:
        image:
          # The chart does not follow the Immich releases: version pinned here, by digest.
          # renovate: image=ghcr.io/immich-app/immich-server
          tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd

immich:
  persistence:
    # /data: thumbnails, previews, transcodes and database backups (rw export on the NAS).
    library:
      existingClaim: immich-data
  # Config file managed by git: the matching settings screens in the UI become
  # read-only, and everything not set here uses the Immich default.
  configuration:
    machineLearning:
      # No face recognition/semantic search for now (laptop CPU).
      enabled: false
    ffmpeg:
      # Only transcode what the browser cannot play; HEVC (phone) goes straight through.
      transcode: required
      acceptedVideoCodecs: [h264, hevc]
    backup:
      database:
        # Off: the database is backed up by CNPG (Barman Cloud to RustFS, docs/adr/014).
        # The dumps already in /data/backups stay on the NAS until removed by hand.
        enabled: false
    library:
      # Without watch (NFS), new NAS photos show up on the next scan: every 2h,
      # at minute 30, away from the NAS replica rsync (3:00).
      scan:
        enabled: true
        cronExpression: "30 */2 * * *"
      # inotify does not see changes made on the NAS over NFS.
      watch:
        enabled: false

valkey:
  enabled: true

machine-learning:
  enabled: false

server:
  controllers:
    main:
      containers:
        main:
          env:
            # Prometheus metrics on :8081 (API) and :8082 (workers), read by the otel-agent.
            IMMICH_TELEMETRY_INCLUDE: all
            # Full URI generated by CloudNativePG (user/password/host of the "app" database).
            DB_URL:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: uri
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
  persistence:
    # NAS photos as an External Library (import path /mnt/nas/fotos in the UI).
    nas-photos:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-photos
      globalMounts:
        - path: /mnt/nas/fotos
          readOnly: true
