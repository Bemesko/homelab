# Values for the grafana chart (grafana-community), version in kubernetes/apps/values.yaml.
# Correlated datasources (metrics <-> logs <-> traces), alert rules and
# dashboards from ConfigMaps (kubernetes/workloads/observability) through the sidecar.
# On the laptop the Application template adds the Ingress, admin and SMTP (SOPS).
image:
  # The digest goes in the tag: the `sha` key takes no "sha256:" prefix, which Renovate cannot write.
  # renovate: image=docker.io/grafana/grafana
  tag: 13.3.0-distroless@sha256:540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  size: 1Gi
# The default securityContext fsGroup (472) already fixes the volume owner.
initChownData:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  # 256Mi got OOMKilled right at startup (Grafana 13 database migrations).
  limits:
    memory: 512Mi

grafana.ini:
  analytics:
    check_for_updates: false
    reporting_enabled: false
  auth.anonymous:
    enabled: false
  # SQLite in WAL mode: readers (login, datasources, rules) do not wait for writes.
  # Without it, an I/O spike on the laptop caused SQLITE_BUSY for ~7 min (ADR 010).
  database:
    wal: true
  users:
    allow_sign_up: false

sidecar:
  image:
    # renovate: image=quay.io/kiwigrid/k8s-sidecar
    tag: 2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
  alerts:
    enabled: true
    label: grafana_alert
    searchNamespace: observability
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: observability
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.observability.svc
        isDefault: true
        jsonData:
          httpMethod: POST
          # Collection every 30-60 s: without this $__rate_interval leaves rate() empty.
          timeInterval: 60s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability.svc:3100
        jsonData:
          # trace_id comes as structured metadata in the OTLP logs.
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.observability.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            customQuery: false
            tags:
              - key: service.name
                value: service_name
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
