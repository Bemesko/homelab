# Values for the tempo chart (grafana-community, single binary), version in
# kubernetes/apps/values.yaml. Traces arrive over OTLP from the otel-gateway and live on the
# laptop disk. See docs/adr/008.
tempo:
  tag: 3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  reportingEnabled: false
  # OTLP only: the collector converts whatever arrives in other formats.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  retention: 168h
  # Service graphs and span metrics (RED) from the traces. It is the only write
  # outside OTLP: Tempo can only send these metrics by remote write.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.observability.svc/api/v1/write
    storage:
      path: /var/tempo/generator/wal
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 3Gi
