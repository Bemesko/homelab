# Values for the opentelemetry-collector chart (otel-gateway release), version in
# kubernetes/apps/values.yaml. Single exit point to the backends: receives OTLP
# from the otel-agent, the hosts (otel_host_agent) and the NAS (through the "otel" Service
# on the tailnet), collects the cluster events and exports over OTLP to Prometheus, Loki and
# Tempo. Switching backends = switching the exporters here. The Kubernetes metrics
# (kube_*) come from kube-state-metrics, scraped by the otel-agent (ADR 013).
mode: deployment
replicaCount: 1
fullnameOverride: otel-gateway

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.163.2
  digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849

# No clusterMetrics preset (k8s_cluster receiver): replaced by kube-state-metrics.
presets:
  kubernetesEvents:
    enabled: true

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    resource:
      attributes:
        - key: k8s.cluster.name
          value: homelab
          action: insert
    # Loki stores the OTLP ObservedTimestamp as the observed_timestamp structured metadata,
    # unique per line. Unaggregated metric queries group by structured metadata too, so
    # count_over_time({k8s_namespace_name="argocd"}[10m]) returned one series per line and
    # hit the 500-series limit. Zero it (Loki skips the field when it is 0), keeping it as
    # the timestamp only for records that have none (Loki's own fallback order).
    transform/drop_observed_time:
      error_mode: ignore
      log_statements:
        - set(log.time, log.observed_time) where log.time_unix_nano == 0
        - set(log.observed_time_unix_nano, 0)
  exporters:
    debug: null
    otlphttp/prometheus:
      metrics_endpoint: http://prometheus-server.observability.svc/api/v1/otlp/v1/metrics
      tls:
        insecure: true
    otlphttp/loki:
      logs_endpoint: http://loki.observability.svc:3100/otlp/v1/logs
      tls:
        insecure: true
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls:
        insecure: true
  service:
    telemetry:
      resource:
        service.name: otel-gateway
      # The collector's own telemetry over OTLP (receiver on the pod IP, not on localhost).
      metrics:
        level: normal
        readers:
          - periodic:
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: http://${env:MY_POD_IP}:4318
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, transform/drop_observed_time, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlphttp/prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp/tempo]

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi
