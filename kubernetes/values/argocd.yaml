# Values for the argo-cd chart, used by the bootstrap helm install and by the self-managed release.
# The Tailscale Ingress is added in kubernetes/apps/templates/argocd.yaml.
configs:
  params:
    # TLS terminates at the Tailscale Operator proxy
    server.insecure: true
    # Sync/render/API traces over OTLP to the otel-agent (docs/adr/008).
    otlp.address: otel-agent.observability.svc:4317
    otlp.insecure: true
  cm:
    # Enables the KSOPS generator (exec KRM function) in kustomize Applications.
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    # Real health for the child Applications: without it the app-of-apps sync-waves
    # do not wait for (e.g.) the CNPG operator to become Healthy before the Cluster.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    # Helm charts over OCI (no credentials: public repository).
    immich-charts:
      name: immich-charts
      type: helm
      url: ghcr.io/immich-app/immich-charts
      enableOCI: "true"
dex:
  enabled: false
notifications:
  enabled: false

# KSOPS: decrypts *.sops.yaml while rendering, with the cluster's age key
# (Secret argocd/sops-age, created by Ansible before ArgoCD). See docs/adr/004-ksops.md.
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: [/usr/local/bin/ksops, install, --with-kustomize, /custom-tools]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  volumeMounts:
    # Only ksops: kustomize stays the one shipped in the ArgoCD image.
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /sops-age
      readOnly: true
  metrics:
    enabled: true

# Metrics Services read by the otel-agent (prometheus receiver), which sends them over
# OTLP to Prometheus. argocd_app_info feeds the alert for Applications out of Healthy.
controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
