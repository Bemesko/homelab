# Values for the prometheus chart (prometheus-community), version in kubernetes/apps/values.yaml.
# TSDB only: metrics arrive over OTLP from the otel-gateway (Prometheus does no scraping
# at all) and the alert rules live in Grafana. See docs/adr/008.
server:
  image:
    # renovate: image=quay.io/prometheus/prometheus
    tag: v3.16.0
    digest: sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
  extraFlags:
    - web.enable-lifecycle
    # OTLP on /api/v1/otlp (otel-gateway) and remote write from the Tempo metrics-generator.
    - web.enable-otlp-receiver
    - web.enable-remote-write-receiver
  extraArgs:
    enable-feature: exemplar-storage
  global:
    scrape_interval: 1m
    evaluation_interval: 1m
  otlp:
    # Resource attributes become labels (the rest stays in target_info).
    # service.name already becomes the job label (and service.instance.id, the instance).
    promote_resource_attributes:
      - host.name
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.container.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.node.name
    keep_identifying_resource_attributes: true
  tsdb:
    # The gateway batches: samples can arrive a few seconds out of order.
    out_of_order_time_window: 5m
  exemplars:
    max_exemplars: 100000
  # Laptop disk: whichever comes first (time or size) deletes old blocks.
  retention: 30d
  retentionSize: 6GB
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

configmapReload:
  prometheus:
    image:
      # renovate: image=quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.95.1
      digest: sha256:39bdbade0c64f7c38bb6d18d6f602b14ad489bc189b709dc9266b49e6647aac1
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

# No scraping: everything comes in over OTLP through the collector (including the apps' /metrics).
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

alertmanager:
  enabled: false

# Kubernetes state (kube_*), used by OpenCost, the dashboards and the alerts
# (docs/adr/013). Prometheus still does no scraping: the otel-agent scrapes this Service and
# sends it over OTLP.
kube-state-metrics:
  enabled: true
  # Fixed name: the otel-agent kube-state-metrics job points at this Service.
  fullnameOverride: kube-state-metrics
  prometheusScrape: false
  image:
    # renovate: image=registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  # kube_pod_labels and kube_namespace_labels: OpenCost aggregates cost by label.
  metricLabelsAllowlist:
    - pods=[*]
    - namespaces=[*]
  # Only the resources that OpenCost, the dashboards and the alerts use (single node).
  collectors:
    - cronjobs
    - daemonsets
    - deployments
    - horizontalpodautoscalers
    - jobs
    - limitranges
    - namespaces
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - replicasets
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
