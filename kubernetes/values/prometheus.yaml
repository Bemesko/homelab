# Values do chart prometheus (prometheus-community), versão em kubernetes/apps/values.yaml.
# Só o TSDB: as métricas chegam por OTLP do otel-gateway (o Prometheus não faz scrape
# nenhum) e as regras de alerta vivem no Grafana. Veja docs/adr/008.
server:
  image:
    tag: v3.16.0
    digest: sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
  extraFlags:
    - web.enable-lifecycle
    # OTLP em /api/v1/otlp (otel-gateway) e remote write do metrics-generator do Tempo.
    - web.enable-otlp-receiver
    - web.enable-remote-write-receiver
  extraArgs:
    enable-feature: exemplar-storage
  global:
    scrape_interval: 1m
    evaluation_interval: 1m
  otlp:
    # Atributos de resource viram labels (o resto fica em target_info).
    # service.name já vira o label job (e service.instance.id, o instance).
    promote_resource_attributes:
      - host.name
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.container.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.node.name
    keep_identifying_resource_attributes: true
  tsdb:
    # O gateway faz batch: amostras podem chegar alguns segundos fora de ordem.
    out_of_order_time_window: 5m
  exemplars:
    max_exemplars: 100000
  # Disco do notebook: o que bater primeiro (tempo ou tamanho) apaga blocos antigos.
  retention: 30d
  retentionSize: 6GB
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

configmapReload:
  prometheus:
    image:
      tag: v0.95.1
      digest: sha256:39bdbade0c64f7c38bb6d18d6f602b14ad489bc189b709dc9266b49e6647aac1
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

# Sem scrape: tudo entra por OTLP pelo coletor (inclusive os /metrics dos apps).
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

alertmanager:
  enabled: false

# Estado do Kubernetes (kube_*), usado pelo OpenCost, pelos dashboards e pelos alertas
# (docs/adr/013). O Prometheus continua sem scrape: o otel-agent raspa este Service e
# manda por OTLP.
kube-state-metrics:
  enabled: true
  # Nome fixo: o job kube-state-metrics do otel-agent aponta para este Service.
  fullnameOverride: kube-state-metrics
  prometheusScrape: false
  image:
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  # kube_pod_labels e kube_namespace_labels: o OpenCost agrega o custo por label.
  metricLabelsAllowlist:
    - pods=[*]
    - namespaces=[*]
  # Só os recursos que o OpenCost, os dashboards e os alertas usam (nó único).
  collectors:
    - cronjobs
    - daemonsets
    - deployments
    - horizontalpodautoscalers
    - jobs
    - limitranges
    - namespaces
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - replicasets
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
