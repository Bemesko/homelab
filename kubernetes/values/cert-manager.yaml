# cert-manager: only issues the mTLS certificates between the CNPG operator and the
# Barman Cloud plugin (docs/adr/014). No ACME/Let's Encrypt here: the tailnet already
# terminates TLS for the Ingresses (Tailscale Operator).
crds:
  enabled: true
  # Keep the CRDs (and so every Certificate) if the release is ever removed.
  keep: true

image:
  digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}

webhook:
  image:
    digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

cainjector:
  image:
    digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

startupapicheck:
  image:
    digest: sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
