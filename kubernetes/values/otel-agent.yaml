# Values for the opentelemetry-collector chart (otel-agent release), version in
# kubernetes/apps/values.yaml. DaemonSet: pod logs, Kubernetes metrics (kubelet cAdvisor
# and kube-state-metrics, in the Prometheus format), OTLP from apps and scraping of the
# /metrics endpoints that already exist; everything enriched with k8s metadata and sent over OTLP to
# the otel-gateway. See docs/adr/008 (transport) and 013 (Kubernetes metrics).
mode: daemonset
fullnameOverride: otel-agent

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  # renovate: image=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.163.2
  digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849

# No kubeletMetrics preset: kubeletstats emitted container_memory_working_set_bytes and
# other cAdvisor names with k8s_* labels, and would duplicate the real cAdvisor series.
presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

# The kubernetes-nodes-cadvisor job reads the kubelet's /metrics/cadvisor with the
# ServiceAccount token, which needs nodes/metrics (the presets only grant what they use).
clusterRole:
  rules:
    - apiGroups: [""]
      resources: [nodes/metrics]
      verbs: [get]

# filelog reads /var/log/pods (root:root 0640 on the host).
securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [DAC_READ_SEARCH]

# Apps speak OTLP to the otel-agent Service; no hostPort on the laptop.
ports:
  otlp:
    hostPort: 0
  otlp-http:
    hostPort: 0
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

service:
  enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          # Kubernetes metrics in the Prometheus format (ADR 013). Real CPU and memory usage
          # per container: cAdvisor from the node's own kubelet (the agent runs on every node).
          # k3s uses its own certificate on :10250, so the server is not verified.
          - job_name: kubernetes-nodes-cadvisor
            scrape_interval: 60s
            scheme: https
            metrics_path: /metrics/cadvisor
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            static_configs:
              - targets: ["${env:K8S_NODE_IP}:10250"]
                labels: {cluster: homelab, node: "${env:K8S_NODE_NAME}"}
            metric_relabel_configs:
              - source_labels: [__name__]
                # yamllint disable-line rule:line-length
                regex: (container_(cpu_(usage_seconds_total|cfs_(periods_total|throttled_periods_total|throttled_seconds_total))|memory_(working_set_bytes|rss|usage_bytes|cache)|network_(receive|transmit)_(bytes|packets|packets_dropped|errors)_total|fs_(usage_bytes|limit_bytes|reads_bytes_total|writes_bytes_total)|oom_events_total|spec_memory_limit_bytes)|machine_(cpu_cores|memory_bytes))
                action: keep
          # Object state (kube_*): Deployments, Pods, Nodes, PVCs, labels.
          - job_name: kube-state-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [kube-state-metrics.observability.svc:8080]
                labels: {cluster: homelab}
          # Costs per pod, node and namespace. honor_labels: the OpenCost metrics carry their
          # own instance and namespace, which the scrape would rename to exported_*.
          - job_name: opencost
            scrape_interval: 60s
            honor_labels: true
            static_configs:
              - targets: [opencost.opencost.svc:9003]
                labels: {cluster: homelab}
          # Replaces the collector's own scrape (chart default).
          # Job names match the ones in the official ArgoCD dashboard.
          - job_name: argocd-application-controller-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-application-controller-metrics.argocd.svc:8082]
          - job_name: argocd-server-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-server-metrics.argocd.svc:8083]
          - job_name: argocd-repo-server-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-repo-server-metrics.argocd.svc:8084]
          # Backends and DNS: only the series that the dashboards and alerts use (allowlist).
          - job_name: loki
            scrape_interval: 60s
            static_configs:
              - targets: [loki.observability.svc:3100]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                # yamllint disable-line rule:line-length
                regex: (loki_(request_duration_seconds_.*|panic_total|discarded_samples_total|build_info|boltdb_shipper_.*|compactor_.*|ingester_.*|distributor_.*)|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: tempo
            scrape_interval: 60s
            static_configs:
              - targets: [tempo.observability.svc:3200]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                # yamllint disable-line rule:line-length
                regex: (tempo_(distributor_.*|metrics_generator_.*|request_duration_seconds_.*|build_info|ingester_.*)|tempodb_(compaction|blocklist|retention)_.*|prometheus_remote_storage_.*|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: prometheus
            scrape_interval: 60s
            static_configs:
              - targets: [prometheus-server.observability.svc:80]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: (prometheus_.*|net_conntrack_.*|http_request_duration_.*|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: coredns
            scrape_interval: 60s
            static_configs:
              - targets: [kube-dns.kube-system.svc:9153]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: (coredns_(dns_.*|forward_.*|cache_.*|panics_total|health_.*|build_info)|process_.*|go_goroutines)
                action: keep
          # CloudNativePG Postgres (cnpg_backends_total, max_connections...).
          - job_name: cnpg
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
                regex: instance
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          # Immich (IMMICH_TELEMETRY_INCLUDE=all): API on :8081 and workers on :8082.
          # "$$" is a literal "$" (the collector expands ${...} in the config).
          - job_name: immich
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [immich]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                regex: server
                action: keep
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                replacement: $${1}:8081
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          - job_name: immich-workers
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [immich]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                regex: server
                action: keep
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                replacement: $${1}:8082
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
  processors:
    resource:
      attributes:
        - key: k8s.cluster.name
          value: homelab
          action: upsert
  exporters:
    debug: null
    otlp:
      endpoint: otel-gateway.observability.svc:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        queue_size: 1000
  service:
    telemetry:
      resource:
        service.name: otel-agent
      # The collector's own telemetry over OTLP (local receiver): feeds the
      # collector dashboard and export alerts.
      metrics:
        level: normal
        readers:
          - periodic:
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: http://${env:MY_POD_IP}:4318
    # The presets add filelog and k8sattributes to the pipelines.
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
