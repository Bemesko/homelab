suite: external-apps
templates:
  - templates/external-apps.yaml
  - templates/appproject-homelab-apps.yaml
tests:
  # `set` merges with values.yaml: `<app>: null` removes the real apps in isolated tests.
  - it: no apps and no smoke produce no Application
    template: templates/external-apps.yaml
    set:
      apps.grocery-ops: null
      apps.bernats-finances: null
    asserts:
      - hasDocuments:
          count: 0

  - it: grocery-ops (personal Bemesko account, public) comes from values.yaml pinned to a tag
    template: templates/external-apps.yaml
    set:
      apps.bernats-finances: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: grocery-ops
      - equal:
          path: spec.source.repoURL
          value: https://github.com/Bemesko/grocery-ops
      - matchRegex:
          path: spec.source.targetRevision
          pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
      - equal:
          path: spec.destination.namespace
          value: grocery-ops
      - equal:
          path: spec.project
          value: homelab-apps

  - it: bernats-finances (org repo, private via the GitHub App) comes from values.yaml pinned to a tag
    template: templates/external-apps.yaml
    set:
      apps.grocery-ops: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: bernats-finances
      - equal:
          path: spec.source.repoURL
          value: https://github.com/bernats-homelab/bernats-finances-v4
      - matchRegex:
          path: spec.source.targetRevision
          pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
      - equal:
          path: spec.destination.namespace
          value: bernats-finances
      - equal:
          path: spec.project
          value: homelab-apps

  - it: each apps entry becomes an Application in the homelab-apps AppProject, pinned to the tag
    template: templates/external-apps.yaml
    set:
      apps:
        grocery-ops: null
        bernats-finances: null
        alpha:
          repoURL: https://github.com/bernats-homelab/alpha
          targetRevision: v1.2.3
        beta:
          repoURL: https://github.com/bernats-homelab/beta-app
          targetRevision: v0.1.0
          namespace: beta-ns
          syncWave: "4"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Application
      - equal:
          path: spec.project
          value: homelab-apps
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: spec.syncPolicy.automated.prune
          value: true
      - equal:
          path: spec.syncPolicy.automated.selfHeal
          value: true
      - contains:
          path: metadata.finalizers
          content: resources-finalizer.argocd.argoproj.io
      - equal:
          path: metadata.name
          value: alpha
        documentIndex: 0
      - equal:
          path: spec.source.targetRevision
          value: v1.2.3
        documentIndex: 0
      - equal:
          path: spec.source.path
          value: deploy/overlays/tailscale
        documentIndex: 0
      - equal:
          path: spec.destination.namespace
          value: alpha
        documentIndex: 0
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        documentIndex: 0
      - equal:
          path: spec.source.repoURL
          value: https://github.com/bernats-homelab/beta-app
        documentIndex: 1
      - equal:
          path: spec.destination.namespace
          value: beta-ns
        documentIndex: 1
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "4"
        documentIndex: 1

  - it: without Tailscale (CI) external apps use deploy/base
    template: templates/external-apps.yaml
    set:
      tailscaleOperator.enabled: false
      apps:
        alpha:
          repoURL: https://github.com/bernats-homelab/alpha
          targetRevision: v1.2.3
    asserts:
      - equal:
          path: spec.source.path
          value: deploy/base

  - it: the smoke app (CI) syncs the template at the tag from values
    template: templates/external-apps.yaml
    set:
      smokeApp.enabled: true
      tailscaleOperator.enabled: false
      apps.grocery-ops: null
      apps.bernats-finances: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: k8s-app-smoke
      - equal:
          path: spec.source.repoURL
          value: https://github.com/bernats-homelab/repotpl-k8s-app
      - equal:
          path: spec.destination.namespace
          value: k8s-app-smoke
      - equal:
          path: spec.project
          value: homelab-apps

  - it: the AppProject only accepts repos from the org and the Bemesko account, nothing cluster-scoped besides Namespace
    template: templates/appproject-homelab-apps.yaml
    asserts:
      - isKind:
          of: AppProject
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.sourceRepos
          value: [https://github.com/bernats-homelab/*, https://github.com/Bemesko/*]
      - equal:
          path: spec.clusterResourceWhitelist
          value:
            - group: ""
              kind: Namespace
      - contains:
          path: spec.destinations
          content:
            server: https://kubernetes.default.svc
            namespace: "!argocd"
      - contains:
          path: spec.destinations
          content:
            server: https://kubernetes.default.svc
            namespace: "!kube-system"
      - contains:
          path: spec.destinations
          content:
            server: https://kubernetes.default.svc
            namespace: "!immich"
