suite: applications
templates:
  - templates/argocd.yaml
  - templates/tailscale-operator.yaml
  - templates/hello-world.yaml
  - templates/cloudnative-pg.yaml
  - templates/immich-database.yaml
  - templates/immich.yaml
  - templates/obsidian.yaml
  - templates/home-assistant-database.yaml
  - templates/home-assistant.yaml
  - templates/backup.yaml
  - templates/prometheus.yaml
  - templates/loki.yaml
  - templates/tempo.yaml
  - templates/observability.yaml
  - templates/otel-gateway.yaml
  - templates/otel-agent.yaml
  - templates/grafana.yaml
  - templates/opencost.yaml
tests:
  - it: every Application has automated sync with prune and selfHeal
    asserts:
      - isKind:
          of: Application
      - equal:
          path: spec.syncPolicy.automated.prune
          value: true
      - equal:
          path: spec.syncPolicy.automated.selfHeal
          value: true
      - equal:
          path: metadata.namespace
          value: argocd

  - it: sync-waves follow the order operator -> argocd -> workloads
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        template: templates/tailscale-operator.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        template: templates/argocd.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/hello-world.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        template: templates/cloudnative-pg.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/immich-database.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/immich.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/obsidian.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/home-assistant-database.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/home-assistant.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/backup.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/prometheus.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/loki.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/tempo.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/observability.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/otel-gateway.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/otel-agent.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/grafana.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/opencost.yaml

  - it: the ArgoCD Application has no finalizer (it does not delete itself)
    template: templates/argocd.yaml
    asserts:
      - notExists:
          path: metadata.finalizers

  - it: the ArgoCD chart version comes from values (single source)
    template: templates/argocd.yaml
    set:
      charts.argocd.version: 9.9.9
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 9.9.9
      - equal:
          path: spec.sources[0].chart
          value: argo-cd

  - it: repoURL and targetRevision propagate to the repo sources
    set:
      repoURL: https://github.com/example/fork
      targetRevision: abc123
    asserts:
      - equal:
          path: spec.source.repoURL
          value: https://github.com/example/fork
        template: templates/hello-world.yaml
      - equal:
          path: spec.source.targetRevision
          value: abc123
        template: templates/hello-world.yaml
      - equal:
          path: spec.sources[1].repoURL
          value: https://github.com/example/fork
        template: templates/argocd.yaml
      - equal:
          path: spec.sources[1].targetRevision
          value: abc123
        template: templates/argocd.yaml

  - it: with Tailscale on it uses the tailscale overlay and exposes ArgoCD
    asserts:
      - hasDocuments:
          count: 1
        template: templates/tailscale-operator.yaml
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/hello-world/overlays/tailscale
        template: templates/hello-world.yaml
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.ingressClassName
          value: tailscale
        template: templates/argocd.yaml

  - it: with Tailscale off (CI) it removes the operator and the Ingresses
    set:
      tailscaleOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/tailscale-operator.yaml
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/hello-world/base
        template: templates/hello-world.yaml
      - notExists:
          path: spec.sources[0].helm.valuesObject
        template: templates/argocd.yaml

  - it: Immich uses the OCI chart without the oci:// prefix (ArgoCD format)
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: ghcr.io/immich-app/immich-charts
      - equal:
          path: spec.sources[0].chart
          value: immich

  - it: the Immich and CNPG chart versions come from values (single source)
    set:
      charts.immich.version: 9.9.9
      charts.cloudnativePg.version: 8.8.8
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 9.9.9
        template: templates/immich.yaml
      - equal:
          path: spec.sources[0].targetRevision
          value: 8.8.8
        template: templates/cloudnative-pg.yaml

  - it: the Immich database does not depend on the NAS toggle (only Postgres)
    template: templates/immich-database.yaml
    set:
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/immich/database

  - it: PVCs go in the Immich Application (which mounts them), with the NAS in the nas overlay
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[2].path
          value: kubernetes/workloads/immich/storage/overlays/nas

  - it: without the NAS (CI) the Immich PVCs use base (local-path)
    template: templates/immich.yaml
    set:
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.sources[2].path
          value: kubernetes/workloads/immich/storage/base

  - it: Immich exposed as "fotos" only with Tailscale
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.main.className
          value: tailscale
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.main.hosts[0].host
          value: fotos

  - it: without Tailscale (CI) Immich has no Ingress
    template: templates/immich.yaml
    set:
      tailscaleOperator.enabled: false
    asserts:
      - notExists:
          path: spec.sources[0].helm.valuesObject

  - it: Obsidian with Tailscale uses the overlay (borbsidian Ingress + basic auth) and the NAS vault
    template: templates/obsidian.yaml
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/obsidian/overlays/tailscale
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/obsidian/storage/overlays/nas

  - it: without Tailscale and without the NAS (CI) Obsidian uses base for both
    template: templates/obsidian.yaml
    set:
      tailscaleOperator.enabled: false
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/obsidian/base
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/obsidian/storage/base

  - it: Home Assistant with Tailscale uses the overlay (casa Ingress, hostNetwork) and the NAS /config
    template: templates/home-assistant.yaml
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/home-assistant/overlays/tailscale
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/home-assistant/storage/overlays/nas

  - it: without Tailscale and without the NAS (CI) Home Assistant uses base for both
    template: templates/home-assistant.yaml
    set:
      tailscaleOperator.enabled: false
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/home-assistant/base
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/home-assistant/storage/base

  - it: the off-site backup with the NAS uses the nas overlay (Storage Box + NAS PV)
    template: templates/backup.yaml
    asserts:
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/backup/overlays/nas

  - it: without the NAS (CI) the backup uses base (local repository, no secrets)
    template: templates/backup.yaml
    set:
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/backup/base

  - it: the observability chart versions come from values (single source; one chart, two collector releases)
    set:
      charts.opentelemetryCollector.version: 7.7.7
      charts.grafana.version: 6.6.6
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 7.7.7
        template: templates/otel-agent.yaml
      - equal:
          path: spec.sources[0].targetRevision
          value: 7.7.7
        template: templates/otel-gateway.yaml
      - equal:
          path: spec.sources[0].helm.releaseName
          value: otel-gateway
        template: templates/otel-gateway.yaml
      - equal:
          path: spec.sources[0].targetRevision
          value: 6.6.6
        template: templates/grafana.yaml

  - it: Grafana with Tailscale has an Ingress and uses the admin and SMTP SOPS Secrets
    template: templates/grafana.yaml
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject.ingress.hosts[0]
          value: grafana
      - equal:
          path: spec.sources[0].helm.valuesObject.admin.existingSecret
          value: grafana-admin
      - equal:
          path: spec.sources[0].helm.valuesObject.envFromSecret
          value: grafana-smtp
      - equal:
          path: spec.sources[0].helm.valuesObject.envFromSecrets[0].name
          value: grafana-public-url

  - it: the OpenCost chart version comes from values (single source) and it runs in its own namespace
    template: templates/opencost.yaml
    set:
      charts.opencost.version: 5.5.5
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 5.5.5
      - equal:
          path: spec.sources[0].helm.releaseName
          value: opencost
      - equal:
          path: spec.destination.namespace
          value: opencost

  - it: OpenCost with Tailscale exposes the UI as "opencost"
    template: templates/opencost.yaml
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject.opencost.ui.ingress.ingressClassName
          value: tailscale
      - equal:
          path: spec.sources[0].helm.valuesObject.opencost.ui.ingress.hosts[0].host
          value: opencost

  - it: without Tailscale (CI) OpenCost does not expose the UI
    template: templates/opencost.yaml
    set:
      tailscaleOperator.enabled: false
    asserts:
      - notExists:
          path: spec.sources[0].helm.valuesObject

  - it: without Tailscale (CI) Grafana has no Ingress or Secrets and provisioning uses base
    set:
      tailscaleOperator.enabled: false
    asserts:
      - notExists:
          path: spec.sources[0].helm.valuesObject
        template: templates/grafana.yaml
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/observability/base
        template: templates/observability.yaml
