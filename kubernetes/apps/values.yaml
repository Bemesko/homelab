# Repository and revision that the child Applications sync.
# The root Application (kubernetes/bootstrap/root-app.yaml.j2) overrides these values.
repoURL: https://github.com/Bemesko/homelab
targetRevision: main

# true only in the CI lite e2e (docs/adr/015): only argocd, hello-world and the Tailscale operator
# are rendered, so the runner is not busy syncing Immich, Postgres or the observability stack.
minimal: false

tailscaleOperator:
  # false only in CI (no tailnet): removes the operator and the Tailscale Ingresses.
  enabled: true

nasStorage:
  # true: Immich PVCs bound to the NAS NFS PVs (created by Ansible, nas_storage role).
  # false (CI): PVCs on local-path.
  enabled: true

# Apps from other repos (the bernats-homelab org or the personal Bemesko account, public only),
# created from bernats-homelab/repotpl-k8s-app. Each entry becomes an Application
# in the homelab-apps AppProject that syncs the repo's deploy/ at the tag pinned here (like the
# chart versions). New version = a PR changing targetRevision; the app repo's release job
# shows the snippet ready to paste.
#   <name>:                  # name of the Application and, by default, of the namespace
#     repoURL: https://github.com/<owner>/<repo>
#     targetRevision: vX.Y.Z
#     namespace: <ns>        # optional
#     syncWave: "2"          # optional
apps:
  # Shopping list PWA (Nuxt 4) → https://grocery-ops.<your-tailnet>
  grocery-ops:
    repoURL: https://github.com/Bemesko/grocery-ops
    targetRevision: v0.8.0
  # Household finances PWA (Nuxt 4 + Postgres by CloudNativePG) → https://bernats-finances.<your-tailnet>
  bernats-finances:
    repoURL: https://github.com/bernats-homelab/bernats-finances-v4
    targetRevision: v0.8.0

# The template itself as an external app, enabled only in CI (Ansible external_apps_smoke_enabled):
# the e2e proves the external repo -> AppProject -> Application path. Use a published tag.
smokeApp:
  enabled: false
  repoURL: https://github.com/bernats-homelab/repotpl-k8s-app
  targetRevision: v0.1.0

# SINGLE SOURCE of chart versions. Ansible reads this file for the initial ArgoCD
# helm install, so the bootstrap and the self-managed release always use the same version.
charts:
  argocd:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: 10.11.6
  tailscaleOperator:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: 1.104.7
  cloudnativePg:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1
  # Postgres backups (docs/adr/014): the Barman Cloud plugin needs CNPG >= 1.30 and
  # cert-manager (it talks to the operator over mTLS); RustFS is the S3 store, on the NAS.
  barmanCloudPlugin:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    version: 0.9.0
  certManager:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.3
  rustfs:
    repoURL: https://charts.rustfs.com
    chart: rustfs
    version: 1.0.6
  immich:
    # OCI only: the immich-charts HTTP repo was discontinued.
    repoURL: oci://ghcr.io/immich-app/immich-charts
    chart: immich
    version: 0.13.4
  # Observability (docs/adr/008). The Grafana charts moved to grafana-community.
  prometheus:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    version: 29.45.0
  loki:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 21.0.0
  tempo:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: 3.2.1
  grafana:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    version: 14.4.0
  # One chart, two releases: otel-agent (DaemonSet) and otel-gateway (Deployment).
  opentelemetryCollector:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.178.2
  # Cost per namespace, pod and node (docs/adr/013). Reads Prometheus over HTTP; the exporter
  # and UI images already come with digests in the chart itself.
  opencost:
    repoURL: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    version: 2.5.34
