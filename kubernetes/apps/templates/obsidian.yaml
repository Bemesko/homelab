apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obsidian
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # "borbsidian" Ingress and basic auth (KSOPS) only with Tailscale; CI uses base.
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: kubernetes/workloads/obsidian/{{ ternary "overlays/tailscale" "base" .Values.tailscaleOperator.enabled }}
    # The vault PVC lives in the same Application as the Deployment that mounts it: on local-path (CI)
    # it only binds once the pod exists. overlays/nas uses the NFS PV created by Ansible.
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: kubernetes/workloads/obsidian/storage/{{ ternary "overlays/nas" "base" .Values.nasStorage.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: obsidian
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
