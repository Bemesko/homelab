{{- if not .Values.minimal }}
{{- /*
Apps from other repos (template bernats-homelab/repotpl-k8s-app), declared under `apps`
in values.yaml. The app repo holds the kustomize in deploy/; only the Application lives here,
pinned to a tag. See docs/adr/007-external-apps.md.
*/}}
{{- $apps := deepCopy .Values.apps }}
{{- if .Values.smokeApp.enabled }}
{{- $_ := set $apps "k8s-app-smoke" (pick .Values.smokeApp "repoURL" "targetRevision") }}
{{- end }}
{{- range $name, $app := $apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "2" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Restricted to org/personal repos and namespaced resources (templates/appproject-homelab-apps.yaml).
  project: homelab-apps
  source:
    repoURL: {{ $app.repoURL }}
    targetRevision: {{ $app.targetRevision }}
    path: deploy/{{ ternary "overlays/tailscale" "base" $.Values.tailscaleOperator.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace | default $name }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
