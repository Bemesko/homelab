{{- if not .Values.minimal }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    # Only the recorder's Postgres (CNPG): it becomes Healthy on its own, before HA (wave 3).
    path: kubernetes/workloads/home-assistant/database/{{ ternary "overlays/nas" "base" .Values.nasStorage.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
