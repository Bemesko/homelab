# Cost per namespace, pod and node, computed from the Prometheus metrics
# (cAdvisor + kube-state-metrics). See docs/adr/013.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.charts.opencost.repoURL }}
      chart: {{ .Values.charts.opencost.chart }}
      targetRevision: {{ .Values.charts.opencost.version | quote }}
      helm:
        releaseName: opencost
        valueFiles:
          - $values/kubernetes/values/opencost.yaml
        {{- if .Values.tailscaleOperator.enabled }}
        # Laptop: the UI lives on the tailnet as "opencost" (no login: anyone on the tailnet
        # is already authenticated). In CI the UI is not exposed.
        valuesObject:
          opencost:
            ui:
              ingress:
                enabled: true
                ingressClassName: tailscale
                hosts:
                  - host: opencost
                    paths: [/]
                tls:
                  - hosts: [opencost]
        {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
