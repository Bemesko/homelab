{{- if and (not .Values.minimal) .Values.offsiteBackup.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup
  namespace: argocd
  annotations:
    # After the apps whose data it copies (the Immich dump is in wave 3).
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Storage Box and NAS PV only on the laptop; CI uses base (local repository).
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: kubernetes/workloads/backup/{{ ternary "overlays/nas" "base" .Values.nasStorage.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
