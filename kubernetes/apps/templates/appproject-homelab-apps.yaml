apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-apps
  namespace: argocd
  annotations:
    # Before the Applications that use it (templates/external-apps.yaml).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Apps from other repos (repotpl-k8s-app); namespaced resources only
  sourceRepos:
    - https://github.com/bernats-homelab/*
    # Personal account: public repos only (the GitHub App credential only covers the org).
    - https://github.com/Bemesko/*
  destinations:
    # Any namespace, except the system and platform ones (ArgoCD negation).
    - server: https://kubernetes.default.svc
      namespace: "*"
    {{- range list "argocd" "kube-system" "kube-public" "kube-node-lease" "default" "tailscale" "cnpg-system" "immich" "obsidian" "home-assistant" "backup" "hello-world" }}
    - server: https://kubernetes.default.svc
      namespace: "!{{ . }}"
    {{- end }}
  # Nothing cluster-scoped (ClusterRole, CRD, webhook...), only the CreateNamespace Namespace.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
