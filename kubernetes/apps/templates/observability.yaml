{{- if not .Values.minimal }}
# Grafana provisioning (alert rules) and, on the laptop, the Grafana Secrets,
# the email contact point and the otel-gateway on the tailnet ("otel").
# Wave 2: the Secrets exist before Grafana (wave 3). See docs/adr/008.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: kubernetes/workloads/observability/{{ ternary "overlays/tailscale" "base" .Values.tailscaleOperator.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large dashboards: the client-side apply last-applied annotation exceeds 256 KB.
      - ServerSideApply=true
{{- end }}
