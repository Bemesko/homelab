{{- if not .Values.minimal }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    # After the database and the PVCs (immich-database, wave 2).
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # OCI chart: ArgoCD wants the registry without the oci:// prefix (repository in kubernetes/values/argocd.yaml).
    - repoURL: {{ trimPrefix "oci://" .Values.charts.immich.repoURL }}
      chart: {{ .Values.charts.immich.chart }}
      targetRevision: {{ .Values.charts.immich.version | quote }}
      helm:
        releaseName: immich
        valueFiles:
          - $values/kubernetes/values/immich.yaml
        {{- if .Values.tailscaleOperator.enabled }}
        valuesObject:
          server:
            ingress:
              main:
                enabled: true
                className: tailscale
                hosts:
                  - host: fotos
                    paths:
                      - path: /
                        service:
                          identifier: main
                tls:
                  - hosts: [fotos]
        {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
    # PVCs in the same Application as the Deployment that mounts them: on local-path (CI) they
    # only bind once the pod exists. overlays/nas uses the NFS PVs created by Ansible.
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: kubernetes/workloads/immich/storage/{{ ternary "overlays/nas" "base" .Values.nasStorage.enabled }}
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
