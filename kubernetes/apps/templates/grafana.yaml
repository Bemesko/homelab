{{- if not .Values.minimal }}
# Datasources, alerts and dashboards; provisioning in kubernetes/workloads/observability. See docs/adr/008.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.charts.grafana.repoURL }}
      chart: {{ .Values.charts.grafana.chart }}
      targetRevision: {{ .Values.charts.grafana.version | quote }}
      helm:
        releaseName: grafana
        valueFiles:
          - $values/kubernetes/values/grafana.yaml
        {{- if .Values.tailscaleOperator.enabled }}
        # Laptop: "grafana" Ingress on the tailnet, admin and SMTP from the SOPS Secrets
        # (kubernetes/workloads/observability/overlays/tailscale). In CI the chart
        # generates the admin password and SMTP stays off.
        valuesObject:
          ingress:
            enabled: true
            ingressClassName: tailscale
            hosts: [grafana]
            path: /
            pathType: Prefix
            tls:
              - hosts: [grafana]
          admin:
            existingSecret: grafana-admin
          envFromSecret: grafana-smtp
          # GF_SERVER_ROOT_URL (links in alerts) with the Ingress URL; created by the
          # cluster_bootstrap role with the tailnet name discovered at runtime.
          envFromSecrets:
            - name: grafana-public-url
              optional: true
        {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
