# Install and run in WSL (control machine): `make deps && pre-commit install`.
# The `language: system` hooks depend on the tools installed by scripts/setup-control-node.sh.
# The CI `lint` job runs exactly this configuration.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # OpenTofu writes the encrypted state as one line without a final newline, on every apply.
        exclude: ^infra/[^/]+/terraform\.tfstate$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
        args: [--allow-multiple-documents]
        # The Home Assistant configuration.yaml uses its own tags (!include, !env_var); yamllint still validates it.
        exclude: ^kubernetes/apps/templates/|\.j2$|^kubernetes/workloads/home-assistant/base/configuration\.yaml$
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-d, -i, "2", -ci]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.261.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        files: ^(renovate\.json|renovate/[^/]+\.json)$

  - repo: local
    hooks:
      - id: no-local-inventory
        name: real inventory (hostname/user) must not be committed
        language: fail
        entry: "Only inventory.example.yaml and ci.yaml may be versioned in ansible/inventory/"
        files: ^ansible/inventory/
        exclude: ^ansible/inventory/(inventory\.example|ci)\.yaml$

      - id: no-kubeconfig
        name: kubeconfig must not be committed
        language: fail
        entry: "kubeconfigs live in ~/.kube/, outside the repo"
        files: (^|/)(kubeconfig[^/]*|[^/]*\.kubeconfig)$

      - id: sops-encrypted
        name: "*.sops.yaml files are encrypted"
        language: script
        entry: scripts/check-sops-encrypted.sh
        # excludes the `.sops.yaml` configuration file
        files: (^|/)[^/.][^/]*\.sops\.yaml$

      - id: no-lockout
        name: playbook does not touch the host's Tailscale/SSH/firewall/network
        language: script
        entry: scripts/check-no-lockout.sh
        files: ^ansible/
        # Exceptions: the control node's own Tailscale and SSH server settings, which only run on the
        # Pi (issue #32, ADR 016); and host_network, which only adds a DHCP profile to the wired port and
        # a Wi-Fi power-save setting, with a rollback (issue #24, ADR 017).
        exclude: ^ansible/roles/(control_node_(tailscale|ssh)|host_network)/
        types: [yaml]

      - id: ansible-lint
        name: ansible-lint (profile production)
        language: system
        entry: ansible-lint
        pass_filenames: false
        files: ^ansible/

      - id: vendor-dashboards-check
        name: Grafana dashboards match the lock (sha256, uids, size)
        language: script
        entry: scripts/vendor-dashboards.sh
        args: [--check]
        pass_filenames: false
        files: ^(kubernetes/workloads/observability/base/dashboards/|scripts/vendor-dashboards\.sh)

      - id: alert-rules-check
        name: Grafana alert rules (unique uid, severity, datasource)
        language: system
        entry: python3 scripts/check-alert-rules.py
        pass_filenames: false
        files: ^(kubernetes/workloads/observability/base/alerts/|scripts/check-alert-rules\.py)

      - id: tofu-validate
        name: tofu fmt + validate (infra/)
        language: script
        entry: scripts/tofu-validate.sh
        pass_filenames: false
        files: ^(infra/|scripts/tofu-validate\.sh)

      - id: helm-lint
        name: helm lint --strict (chart app-of-apps)
        language: system
        entry: helm lint --strict kubernetes/apps
        pass_filenames: false
        files: ^kubernetes/apps/

      - id: helm-unittest
        name: helm unittest (chart app-of-apps)
        language: system
        entry: helm unittest kubernetes/apps
        pass_filenames: false
        files: ^kubernetes/apps/

      - id: validate-manifests
        name: kubeconform + kube-linter on the repo manifests
        language: script
        entry: scripts/validate-manifests.sh
        pass_filenames: false
        files: ^kubernetes/
