name: e2e-full

# Full e2e (every Application Synced/Healthy plus the observability pipeline), off the PR path.
# It is a canary for drift (a chart or image that disappeared upstream), not a merge gate:
# ArgoCD already follows `main`, so running it after the merge would add nothing (docs/adr/015).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Only the `e2e-full` label on a PR; any other label event is ignored.
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e-full'
    uses: ./.github/workflows/e2e.yaml
    with:
      profile: full
