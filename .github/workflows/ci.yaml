name: ci

# Design and required checks: docs/adr/015-ci-flow-and-required-checks.md.
# The only check meant to be REQUIRED in the branch protection is `ci-ok`: the e2e is skipped
# when the change cannot affect the cluster, and a skipped job must not block a PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: each commit there keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  # Decides whether the e2e (k3s + ArgoCD on the runner) is worth its minutes for this change.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
      e2e_profile: ${{ steps.classify.outputs.e2e_profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the base commit must be present for the diff
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Control machine tools
        uses: ./.github/actions/setup-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pre-commit
            .cache/kubeconform
            .cache/tofu-plugins
          key: lint-${{ hashFiles('.pre-commit-config.yaml', 'infra/**/.terraform.lock.hcl') }}
      - name: pre-commit (same config as WSL)
        run: pre-commit run --all-files --show-diff-on-failure

  render:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Control machine tools
        uses: ./.github/actions/setup-tools
      - name: helm lint + unittest
        run: make test-unit
      - name: Render + kubeconform/kube-linter (includes upstream charts)
        run: make test-render

  # A new version of a downloaded tool must come with its sha256 (docs/adr/021): recomputes the hashes of
  # the versions this pull request changes and fails if they differ. The e2e does not install most of them.
  checksums:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the base commit holds the previous versions
      - name: sha256 of the changed versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/update-checksums.sh --changed "${BASE_SHA}"
          git diff --exit-code

  # Runs in parallel with lint/render: a failing lint should not hide an e2e result (or the reverse).
  e2e:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yaml
    with:
      profile: ${{ needs.changes.outputs.e2e_profile }}

  # Stable aggregate for the branch protection. Skipped is fine (e2e not needed); failed or cancelled is not.
  ci-ok:
    if: always()
    needs: [changes, lint, render, checksums, e2e]
    runs-on: ubuntu-26.04
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "ERROR: a job finished as '${result}'" >&2
                exit 1
                ;;
            esac
          done
