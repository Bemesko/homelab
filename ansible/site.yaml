- name: Bootstrap the k3s cluster
  hosts: k3s_server
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load the SOPS secrets (decrypted on the controller)
      community.sops.load_vars:
        file: "{{ secrets_file }}"
      no_log: true
      tags: [always]
  roles:
    - role: preflight
      tags: [preflight, always]
    - role: base
      tags: [base]
    - role: os_updates
      tags: [os_updates]
    - role: power
      tags: [power]
    - role: tailscale_check
      when: tailscale_enabled | bool
      tags: [tailscale, always]
    - role: k3s
      tags: [k3s]
    - role: cluster_bootstrap
      tags: [cluster]
    - role: otel_host_agent
      when: otel_host_agent_enabled | bool
      tags: [otel]
    - role: nas_storage
      when: nas_storage_enabled | bool
      tags: [nas]
    - role: kubeconfig_export
      when: tailscale_enabled | bool
      tags: [kubeconfig]

# Authorizes the control node (Raspberry Pi) over SSH on the laptop and the NAS: add only,
# run from a machine that still has access (`make control-access`). Issue #32.
- name: Authorize the control node's SSH keys
  hosts: k3s_server:nas
  become: false
  gather_facts: true
  roles:
    - role: control_node_access
      when: control_node_access_public_keys | length > 0
      tags: [control_access]

# The exceptions to "Ansible does not change the NAS": Syncthing (ADR 011), which
# the openmediavault UI cannot manage, and power (ADR 012). Without a `nas` group (CI), it does not run.
- name: NAS Syncthing and power
  hosts: nas
  become: false
  gather_facts: true
  roles:
    - role: power
      when: nas_power_enabled | bool
      tags: [nas, power]
    - role: nas_syncthing
      when: nas_syncthing_enabled | bool
      tags: [nas, syncthing]
