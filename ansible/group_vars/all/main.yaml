# Repository ArgoCD syncs (overridden in CI with the PR's repo/SHA)
git_repo_url: https://github.com/Bemesko/homelab
git_revision: main

# false only in CI: skips the host Tailscale check and the Tailscale Operator
tailscale_enabled: true

# true only on the laptop (ansible/inventory/local.yaml): checks the NAS NFS exports
# and creates the Immich PVs. In CI Immich uses local-path.
nas_storage_enabled: false

# true only in CI: ArgoCD syncs the app template itself (bernats-homelab/repotpl-k8s-app)
# as an external app (smokeApp in kubernetes/apps/values.yaml), testing the homelab-apps AppProject.
external_apps_smoke_enabled: false

# true only in the CI lite e2e: the root Application renders just argocd, hello-world and the
# Tailscale operator (chart value `minimal`, docs/adr/015).
apps_minimal: false

# Secrets encrypted with SOPS; decrypted on the controller
secrets_file: "{{ playbook_dir }}/secrets/secrets.sops.yaml"

# Pinned versions of the binaries installed on the laptop
# renovate: datasource=github-releases depName=k3s-io/k3s versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\+k3s(?<build>\d+)$
k3s_version: v1.37.1+k3s1
k3s_install_script_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
# renovate: datasource=github-releases depName=helm/helm
helm_version: v4.3.2
helm_sha256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
# Same image version as the cluster collectors (kubernetes/values/otel-*.yaml)
# renovate: datasource=github-releases depName=open-telemetry/opentelemetry-collector-releases extractVersion=^v(?<version>.+)$
otel_host_agent_version: 0.163.2
otel_host_agent_deb_sha256_amd64: 5a175c93c5a560368c1bdbf0ec25fdc06e7b7d852f424bf7dbc36da6fd495db7
otel_host_agent_deb_sha256_arm64: bd8dbff4f118dc5b6e414ba9fb2d74ca33dfb116b781c6b5024e0285e2478430
# NAS Syncthing (.deb from the GitHub release)
# renovate: datasource=github-releases depName=syncthing/syncthing extractVersion=^v(?<version>.+)$
nas_syncthing_version: 2.1.3
nas_syncthing_deb_sha256: ed148130661a27cd3961fda58bd91c17b205fa3d7ab312a1d6cbf21e59731f30

# true only on the laptop (ansible/inventory/local.yaml, as a host var): installs the
# OpenTelemetry Collector on the host. CI has no tailnet to reach the "otel" gateway.
otel_host_agent_enabled: false

# true only on the NAS (`nas` group of ansible/inventory/local.yaml, as a host var):
# manages the NAS Syncthing (ADR 011). CI has no `nas` group.
nas_syncthing_enabled: false

# true only on the laptop (host var in ansible/inventory/local.yaml): wired-first network with a
# rollback (issue #24, ADR 017). CI has no laptop network to change.
host_network_enabled: false

# true only on the control node (host var in ansible/inventory/local.yaml): the Pi sends Wake-on-LAN
# packets after a boot, so the hosts come back when the power returns (issue #23, ADR 018).
wol_sender_enabled: false

# true only on the NAS (host var in ansible/inventory/local.yaml): applies the power role
# on the NAS (lid, sleep, battery guard; ADR 012). CI has no `nas` group.
nas_power_enabled: false

# Chart versions: single source in kubernetes/apps/values.yaml (read on the controller)
apps_values: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../kubernetes/apps/values.yaml') | from_yaml }}"

# Kubeconfig written on the controller (outside the repo) pointing at the laptop's MagicDNS
kubeconfig_local_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/notebook.yaml"
