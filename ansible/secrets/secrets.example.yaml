# Template (plain text, no real values). To create the real file:
#   cp ansible/secrets/secrets.example.yaml ansible/secrets/secrets.sops.yaml
#   sops --encrypt --in-place ansible/secrets/secrets.sops.yaml
#   sops ansible/secrets/secrets.sops.yaml   # edits it already encrypted
tailscale_oauth_client_id: REPLACE_ME
tailscale_oauth_client_secret: REPLACE_ME
# Cluster age key (KSOPS): `age-keygen | grep AGE-SECRET-KEY`; the public one goes in .sops.yaml.
sops_age_cluster_key: REPLACE_ME
# Optional (private external apps; see the README). Empty = no credential.
# The org's GitHub App (Contents: read-only) ArgoCD uses to read the private repos.
argocd_github_app_id: ""
argocd_github_app_installation_id: ""
argocd_github_app_private_key: ""
# Classic PAT with only read:packages: k3s pulls private images from ghcr.io.
ghcr_pull_username: ""
ghcr_pull_token: ""
