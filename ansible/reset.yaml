- name: Remove k3s (does not touch Tailscale or SSH)
  hosts: k3s_server
  become: true
  gather_facts: false
  vars_prompt:
    - name: reset_confirm
      prompt: "This DELETES the k3s cluster and all of its data. Type 'yes' to continue"
      private: false
  tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: reset_confirm == 'yes'
        fail_msg: Reset cancelled.

    - name: Uninstall k3s
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-uninstall.sh

    - name: Remove the bootstrap files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/k3s-bootstrap
        - /etc/rancher/k3s
