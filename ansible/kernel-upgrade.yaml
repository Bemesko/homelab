# Controlled kernel upgrade of the laptop (ADR 010). unattended-upgrades does not
# touch linux-* (os_updates role); this playbook installs the new kernel, reboots
# and only removes the old kernel after validating the cluster. Usage: make kernel-upgrade.
- name: Upgrade the kernel and validate the cluster
  hosts: k3s_server
  become: true
  gather_facts: false
  vars:
    kernel_upgrade_kubectl: /usr/local/bin/k3s kubectl
  tasks:
    - name: List the kernel packages with an update
      ansible.builtin.shell: |
        set -o pipefail
        apt-get update -qq
        apt list --upgradable 2>/dev/null | awk -F/ '/^linux-/ {print $1}'
      args:
        executable: /bin/bash
      register: kernel_upgrade_pending
      changed_when: false
      check_mode: false

    - name: Install the kernel update
      ansible.builtin.apt:
        name: "{{ kernel_upgrade_pending.stdout_lines }}"
        state: latest # noqa package-latest
        only_upgrade: true
      when: kernel_upgrade_pending.stdout_lines | length > 0

    - name: Read the running kernel and the newest installed one
      ansible.builtin.shell: |
        set -o pipefail
        uname -r
        find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -printf '%f\n' | sed 's/^vmlinuz-//' | sort -V | tail -1
      args:
        executable: /bin/bash
      register: kernel_upgrade_versions
      changed_when: false
      check_mode: false

    - name: Reboot into the new kernel
      ansible.builtin.reboot:
        msg: "make kernel-upgrade: rebooting into kernel {{ kernel_upgrade_versions.stdout_lines[1] }}"
        reboot_timeout: 900
      when: kernel_upgrade_versions.stdout_lines[0] != kernel_upgrade_versions.stdout_lines[1]

    - name: Check the kernel after the boot
      ansible.builtin.command: uname -r
      register: kernel_upgrade_running
      changed_when: false
      check_mode: false
      failed_when: kernel_upgrade_running.stdout != kernel_upgrade_versions.stdout_lines[1]

    - name: Wait for the node to be Ready
      ansible.builtin.command: "{{ kernel_upgrade_kubectl }} wait --for=condition=Ready node --all --timeout=600s"
      changed_when: false
      check_mode: false

    - name: Wait for every Application to be Synced and Healthy
      ansible.builtin.shell: |
        set -o pipefail
        {{ kernel_upgrade_kubectl }} -n argocd get applications \
          -o jsonpath='{range .items[*]}{.metadata.name}={.status.sync.status}/{.status.health.status}{"\n"}{end}' \
          | grep -v '=Synced/Healthy$' || true
      args:
        executable: /bin/bash
      register: kernel_upgrade_apps
      changed_when: false
      check_mode: false
      until: kernel_upgrade_apps.stdout | length == 0
      retries: 60
      delay: 15

    - name: Wait for the Postgres clusters (CNPG) to be ready
      ansible.builtin.command: >-
        {{ kernel_upgrade_kubectl }} wait clusters.postgresql.cnpg.io --all -A
        --for=condition=Ready --timeout=600s
      changed_when: false
      check_mode: false

    - name: Look for AppArmor denials since the boot (signals and D-Bus)
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -k -b --no-pager | grep 'apparmor="DENIED"' | grep -E 'operation="(signal|dbus)' || true
      args:
        executable: /bin/bash
      register: kernel_upgrade_denied
      changed_when: false
      check_mode: false
      failed_when: kernel_upgrade_denied.stdout | length > 0

    - name: Remove old kernels (apt keeps the current and the previous one)
      ansible.builtin.apt:
        autoremove: true
        purge: true
