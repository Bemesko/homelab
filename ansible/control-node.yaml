# Configures the control node (Raspberry Pi 3B, Debian trixie aarch64; issue #32).
# Run by hand from the Pi with `make control-node`. Separate from site.yaml: the CI does not have this group.
- name: Configure the control node
  hosts: control_node
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load the SOPS secrets (decrypted on the controller)
      community.sops.load_vars:
        file: "{{ secrets_file }}"
      no_log: true
      tags: [always]
  roles:
    - role: control_node_base
      tags: [base]
    - role: control_node_tailscale
      when: tailscale_enabled | bool
      tags: [tailscale]
    - role: control_node_keys
      tags: [keys]

# Authorizes the Pi's SSH key on the laptop and the NAS: add only, run from a machine that still
# has access (`make control-access`). The key is the fact the keys role set on the Pi above.
- name: Authorize the control node's SSH key on the managed hosts
  hosts: k3s_server:nas
  become: false
  gather_facts: true
  roles:
    - role: control_node_access
      vars:
        control_node_access_public_keys:
          - "{{ hostvars[groups['control_node'][0]]['control_node_keys_ssh_public_key'] }}"
      when: groups['control_node'] | default([]) | length > 0
      tags: [control_access]
