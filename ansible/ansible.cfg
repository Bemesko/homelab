# On /mnt/c WSL marks the directory as world-writable and Ansible ignores this
# file when read from the cwd; the Makefile exports ANSIBLE_CONFIG pointing here.
[defaults]
inventory = inventory/local.yaml
roles_path = roles
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
