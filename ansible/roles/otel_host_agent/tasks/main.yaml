# OpenTelemetry Collector (contrib) directly on the host: journald (k3s, kernel,
# AppArmor) and the host metrics are not visible from inside the cluster.
- name: Download otelcol-contrib
  vars:
    otel_host_agent_release: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download
  ansible.builtin.get_url:
    url: "{{ otel_host_agent_release }}/v{{ otel_host_agent_version }}/otelcol-contrib_{{ otel_host_agent_version }}_linux_{{ otel_host_agent_arch }}.deb"
    dest: "/var/cache/otelcol-contrib_{{ otel_host_agent_version }}_linux_{{ otel_host_agent_arch }}.deb"
    checksum: "sha256:{{ otel_host_agent_deb_sha256 }}"
    mode: "0644"
  register: otel_host_agent_deb

- name: Install otelcol-contrib
  ansible.builtin.apt:
    deb: "/var/cache/otelcol-contrib_{{ otel_host_agent_version }}_linux_{{ otel_host_agent_arch }}.deb"
  # In check mode get_url does not download the file, so there is nothing to install.
  when: not (ansible_check_mode and otel_host_agent_deb is changed)
  notify: Restart otelcol-contrib

- name: Allow the collector to read journald
  ansible.builtin.user:
    name: otelcol-contrib
    groups: [systemd-journal]
    append: true
  when: not (ansible_check_mode and otel_host_agent_deb is changed)
  notify: Restart otelcol-contrib

- name: Configure otelcol-contrib
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and otel_host_agent_deb is changed)
  notify: Restart otelcol-contrib

- name: Enable and start otelcol-contrib
  ansible.builtin.systemd_service:
    name: otelcol-contrib
    enabled: true
    state: started
  when: not (ansible_check_mode and otel_host_agent_deb is changed)
