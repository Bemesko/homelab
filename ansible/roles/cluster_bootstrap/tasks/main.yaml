# In check mode on a host without k3s there is no API to query yet.
- name: Bootstrap the cluster
  when: not ansible_check_mode or k3s_installed_version | default('') | length > 0
  # Through env (not the `kubeconfig` parameter): the action plugin reads the parameter on the
  # controller without become; the env is read by the module on the host, already as root.
  environment:
    K8S_AUTH_KUBECONFIG: "{{ cluster_bootstrap_kubeconfig }}"
    KUBECONFIG: "{{ cluster_bootstrap_kubeconfig }}"
  block:
    - name: Create the bootstrap namespaces
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        state: present
      loop: [argocd, tailscale]

    # ArgoCD creates the namespace on sync (CreateNamespace=true); we create it earlier only to
    # put the Grafana public URL Secret in it.
    - name: Create the observability namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: observability
        state: present
      when: tailscale_enabled | bool

    # Grafana public URL ("grafana" Ingress on the tailnet) for the links in alerts.
    # The tailnet name (*.ts.net) does not go into the repo: it comes from the host's DNSName.
    - name: Create the Secret with the Grafana public URL
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-public-url
            namespace: observability
          type: Opaque
          data:
            GF_SERVER_ROOT_URL: "{{ ('https://grafana.' ~ (tailscale_check_dns_name | regex_replace('^[^.]+\\.', '')) ~ '/') | b64encode }}"
      no_log: true
      when: tailscale_enabled | bool

    # Created before ArgoCD so the operator starts with credentials already in place.
    - name: Create the Tailscale Operator OAuth Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: operator-oauth
            namespace: tailscale
          type: Opaque
          # `data` (not stringData) so the module can compare and stay idempotent.
          data:
            client_id: "{{ tailscale_oauth_client_id | b64encode }}"
            client_secret: "{{ tailscale_oauth_client_secret | b64encode }}"
      no_log: true

    # Mounted by the ArgoCD repo-server (KSOPS): it must exist before the pod starts.
    - name: Create the Secret with the cluster age key (KSOPS)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: argocd
          type: Opaque
          data:
            keys.txt: "{{ (sops_age_cluster_key ~ '\n') | b64encode }}"
      no_log: true

    # Credential template: applies to every repo with the org prefix (external apps
    # from the org). Without a GitHub App in the secrets (CI), it is not created. See docs/adr/007.
    - name: Create the ArgoCD credential for the org repos (GitHub App)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-creds-bernats-homelab
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          type: Opaque
          data:
            type: "{{ 'git' | b64encode }}"
            url: "{{ 'https://github.com/bernats-homelab' | b64encode }}"
            githubAppID: "{{ argocd_github_app_id | string | b64encode }}"
            githubAppInstallationID: "{{ argocd_github_app_installation_id | string | b64encode }}"
            githubAppPrivateKey: "{{ argocd_github_app_private_key | b64encode }}"
      no_log: true
      when: argocd_github_app_id | default('') | string | length > 0

    - name: Check whether the ArgoCD release already exists
      ansible.builtin.command: helm status argocd --namespace argocd
      register: cluster_bootstrap_argocd_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create the bootstrap working directory
      ansible.builtin.file:
        path: "{{ cluster_bootstrap_workdir }}"
        state: directory
        mode: "0700"

    - name: Copy the ArgoCD values
      ansible.builtin.copy:
        src: "{{ cluster_bootstrap_repo_root }}/kubernetes/values/argocd.yaml"
        dest: "{{ cluster_bootstrap_workdir }}/argocd-values.yaml"
        mode: "0600"

    # Installs only if absent: after that ArgoCD manages itself
    # (kubernetes/apps/templates/argocd.yaml) with the same chart version.
    - name: Install ArgoCD
      ansible.builtin.command:
        argv:
          - helm
          - install
          - argocd
          - "{{ cluster_bootstrap_argocd_chart.chart }}"
          - --repo
          - "{{ cluster_bootstrap_argocd_chart.repoURL }}"
          - --version
          - "{{ cluster_bootstrap_argocd_chart.version }}"
          - --namespace
          - argocd
          - --values
          - "{{ cluster_bootstrap_workdir }}/argocd-values.yaml"
          - --wait
          - --timeout
          - 10m
      when: cluster_bootstrap_argocd_status.rc != 0
      changed_when: true

    - name: Wait for the Application CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: applications.argoproj.io
        wait: true
        wait_condition:
          type: Established
        wait_timeout: 300
      when: not ansible_check_mode

    - name: Apply the root Application (app-of-apps)
      kubernetes.core.k8s:
        state: present
        template: "{{ cluster_bootstrap_repo_root }}/kubernetes/bootstrap/root-app.yaml.j2"
      # In check mode without ArgoCD installed the CRD does not exist yet.
      when: not ansible_check_mode or cluster_bootstrap_argocd_status.rc == 0

    - name: Show how to reach ArgoCD
      ansible.builtin.debug:
        msg:
          - "Initial admin password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
          - "UI: https://argocd.<your-tailnet> (through the Tailscale Operator)"
