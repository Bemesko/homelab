argument_specs:
  main:
    short_description: Initial secrets, ArgoCD and the root Application
    options:
      git_repo_url:
        type: str
        required: true
      git_revision:
        type: str
        required: true
      tailscale_enabled:
        type: bool
        required: true
      nas_storage_enabled:
        type: bool
        required: true
      external_apps_smoke_enabled:
        type: bool
        required: true
      apps_minimal:
        type: bool
        required: true
      apps_values:
        type: dict
        required: true
      tailscale_oauth_client_id:
        type: str
        required: true
        no_log: true
      tailscale_oauth_client_secret:
        type: str
        required: true
        no_log: true
      sops_age_cluster_key:
        description: age private key (AGE-SECRET-KEY-1...) that KSOPS uses in the ArgoCD repo-server
        type: str
        required: true
        no_log: true
      argocd_github_app_id:
        description: ID of the GitHub App ArgoCD uses to read the org's private repos (empty = no credential, as in CI)
        type: str
        default: ""
      argocd_github_app_installation_id:
        description: ID of the GitHub App installation in the bernats-homelab org
        type: str
        default: ""
      argocd_github_app_private_key:
        description: Private key (PEM) of the GitHub App
        type: str
        default: ""
        no_log: true
