nas_storage_kubeconfig: /etc/rancher/k3s/k3s.yaml
# Same options used in the test mount and in the PVs. NFSv3 because OMV exports
# /export as the NFSv4 root (fsid=0): in v4 the path would be relative and would not match
# what showmount lists. In v3 the showmount path is exactly what the PV mounts.
nas_storage_mount_options: [hard, nfsvers=3]
# One PV per volume, pre-bound (claimRef) to the PVC with the same name in the app's namespace.
# `export` is the key in nas_storage_exports (inventory); `capacity` is informational
# (NFS enforces no quota). `write_test` writes and deletes a file in the test mount.
nas_storage_volumes:
  - name: immich-photos
    export: photos
    namespace: immich
    access_mode: ReadOnlyMany
    read_only: true
    write_test: false
    capacity: 1Ti
  - name: immich-data
    export: data
    namespace: immich
    access_mode: ReadWriteOnce
    read_only: false
    write_test: true
    capacity: 200Gi
  - name: obsidian-vault
    export: obsidian
    namespace: obsidian
    access_mode: ReadWriteOnce
    read_only: false
    write_test: true
    capacity: 10Gi
  # Second Obsidian instance, for another person's vault (docs/adr/022).
  - name: natsidian-vault
    export: natsidian
    namespace: natsidian
    access_mode: ReadWriteOnce
    read_only: false
    write_test: true
    capacity: 10Gi
  - name: home-assistant-config
    export: home_assistant
    namespace: home-assistant
    access_mode: ReadWriteOnce
    read_only: false
    write_test: true
    capacity: 5Gi
  # RustFS data: the S3 store of the Postgres backups (docs/adr/014).
  - name: rustfs-data
    export: backups
    namespace: rustfs
    access_mode: ReadWriteOnce
    read_only: false
    write_test: true
    capacity: 50Gi
  # Same export as the photos (SSD root), read-only, for the off-site backup restic.
  # Its own PV because the claimRef binds each PV to a single PVC.
  - name: backup-source
    export: photos
    namespace: backup
    access_mode: ReadOnlyMany
    read_only: true
    write_test: false
    capacity: 1Ti
