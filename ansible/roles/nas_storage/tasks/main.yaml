# The NAS is configured through openmediavault (which owns the configuration). This role only
# VERIFIES the exports from the laptop and creates the PVs pointing at them.
- name: Check whether the NFS client (nfs-common) is already installed
  ansible.builtin.stat:
    path: /usr/sbin/showmount
  register: nas_storage_nfs_client

# On the first `make plan` the base role has not installed nfs-common yet (check mode
# installs nothing); checking the exports is left for the apply.
- name: Require the NFS client outside check mode
  ansible.builtin.assert:
    that: nas_storage_nfs_client.stat.exists or ansible_check_mode
    fail_msg: "showmount not found: the base role should have installed nfs-common."
    quiet: true

- name: Warn that checking the exports is left for the apply
  ansible.builtin.debug:
    msg: "nfs-common not installed yet: the base role installs it during the apply, which then checks the exports."
  when: not nas_storage_nfs_client.stat.exists

- name: List the NAS NFS exports
  ansible.builtin.command: showmount --no-headers -e {{ nas_storage_host }}
  register: nas_storage_showmount
  changed_when: false
  failed_when: false
  check_mode: false
  when: nas_storage_nfs_client.stat.exists

- name: Ensure the app exports exist on the NAS
  vars:
    nas_storage_exported: "{{ nas_storage_showmount.stdout_lines | map('split') | map('first') | list }}"
    nas_storage_wanted: "{{ nas_storage_volumes | map(attribute='export') | map('extract', nas_storage_exports) | list }}"
  ansible.builtin.assert:
    that:
      - nas_storage_showmount.rc == 0
      - nas_storage_wanted | difference(nas_storage_exported) | length == 0
    fail_msg: >-
      Missing NFS exports on {{ nas_storage_host }}
      (found: {{ nas_storage_exported | default([]) }};
      error: {{ nas_storage_showmount.stderr | default('', true) or nas_storage_showmount.msg | default('') }}).
      Create them in the OpenMediaVault UI as described in the README (section "NAS: NFS exports in OMV").
  when: nas_storage_nfs_client.stat.exists

# Temporary mount with the same options as the PVs: catches a wrong squash/permission
# before it turns into an Immich pod in CrashLoopBackOff.
- name: Test-mount the exports (temporary)
  ansible.builtin.shell: |
    set -euo pipefail
    dir="$(mktemp -d)"
    # On the first NFS mount of the host, rpc-statd is still starting and the umount
    # can fail once; retry before removing the directory.
    trap 'umount "${dir}" 2>/dev/null || { sleep 2; umount "${dir}"; }; rmdir "${dir}"' EXIT
    mount -t nfs -o "{{ (nas_storage_mount_options + [item.read_only | ternary('ro', 'rw')]) | join(',') }}" \
      "{{ nas_storage_host }}:{{ nas_storage_exports[item.export] }}" "${dir}"
    ls "${dir}" >/dev/null
    {% if item.write_test and not ansible_check_mode %}
    probe="${dir}/.k3s-write-test-$$"
    touch "${probe}" && rm "${probe}"
    {% endif %}
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_volumes }}"
  loop_control:
    label: "{{ item.name }}: {{ nas_storage_exports[item.export] }}"
  changed_when: false
  check_mode: false
  when: nas_storage_nfs_client.stat.exists

- name: App PVs
  when: not ansible_check_mode or k3s_installed_version | default('') | length > 0
  environment:
    K8S_AUTH_KUBECONFIG: "{{ nas_storage_kubeconfig }}"
  block:
    - name: Create NFS PVs pre-bound to the app PVCs
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: "{{ item.name }}"
            labels:
              app.kubernetes.io/part-of: "{{ item.namespace }}"
          spec:
            capacity:
              storage: "{{ item.capacity }}"
            accessModes: ["{{ item.access_mode }}"]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            mountOptions: "{{ nas_storage_mount_options }}"
            nfs:
              server: "{{ nas_storage_host }}"
              path: "{{ nas_storage_exports[item.export] }}"
              readOnly: "{{ item.read_only }}"
            # Only the PVC with the same name, in the app's namespace, may use this PV.
            claimRef:
              namespace: "{{ item.namespace }}"
              name: "{{ item.name }}"
      loop: "{{ nas_storage_volumes }}"
      loop_control:
        label: "{{ item.name }}"
