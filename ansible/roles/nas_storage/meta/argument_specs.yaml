argument_specs:
  main:
    short_description: Checks the NAS NFS exports (without changing the NAS) and creates the app PVs
    options:
      nas_storage_host:
        description: Short MagicDNS name of the NAS (set in ansible/inventory/local.yaml)
        type: str
        required: true
      nas_storage_exports:
        description: Paths exported by OMV
        type: dict
        required: true
        options:
          photos:
            description: Read-only export of the SSD root (Immich External Library and off-site backup source)
            type: str
            required: true
          data:
            description: Writable export for the Immich thumbnails, previews, transcodes and database backups
            type: str
            required: true
          obsidian:
            description: Writable export for the Obsidian vault
            type: str
            required: true
          home_assistant:
            description: Writable export for the Home Assistant /config
            type: str
            required: true
          natsidian:
            description: Writable export for the second Obsidian vault (docs/adr/022)
            type: str
            required: true
          backups:
            description: Writable export for the RustFS data (Postgres backups, ADR 014)
            type: str
            required: true
      nas_storage_kubeconfig:
        type: str
        default: /etc/rancher/k3s/k3s.yaml
      nas_storage_mount_options:
        type: list
        elements: str
        default: [hard, nfsvers=3]
      nas_storage_volumes:
        description: One PV per volume, pre-bound to the PVC with the same name in the app's namespace
        type: list
        elements: dict
        default:
          - {name: immich-photos, export: photos, namespace: immich, access_mode: ReadOnlyMany, read_only: true, write_test: false, capacity: 1Ti}
          - {name: immich-data, export: data, namespace: immich, access_mode: ReadWriteOnce, read_only: false, write_test: true, capacity: 200Gi}
          - {name: obsidian-vault, export: obsidian, namespace: obsidian, access_mode: ReadWriteOnce, read_only: false, write_test: true, capacity: 10Gi}
          - {name: natsidian-vault, export: natsidian, namespace: natsidian, access_mode: ReadWriteOnce, read_only: false, write_test: true, capacity: 10Gi}
          - {name: home-assistant-config, export: home_assistant, namespace: home-assistant, access_mode: ReadWriteOnce,
             read_only: false, write_test: true, capacity: 5Gi}
          - {name: rustfs-data, export: backups, namespace: rustfs, access_mode: ReadWriteOnce, read_only: false, write_test: true,
             capacity: 50Gi}
          - {name: backup-source, export: photos, namespace: backup, access_mode: ReadOnlyMany, read_only: true, write_test: false, capacity: 1Ti}
        options:
          name:
            type: str
            required: true
          export:
            description: Key in nas_storage_exports
            type: str
            required: true
            choices: [photos, data, obsidian, natsidian, home_assistant, backups]
          namespace:
            type: str
            required: true
          access_mode:
            type: str
            required: true
            choices: [ReadOnlyMany, ReadWriteOnce, ReadWriteMany]
          read_only:
            type: bool
            required: true
          write_test:
            type: bool
            required: true
          capacity:
            type: str
            required: true
