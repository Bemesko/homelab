# Wired-first network for the cluster laptop (issue #24, ADR 017). The installer's netplan leaves the
# Ethernet port without DHCP, so the default route stays on Wi-Fi.
host_network_wired_interface: enp2s0f1
# The netplan ID the installer uses for that port. This role extends it with DHCP, so the two files
# must share the ID. The first task checks it and stops before any change if it is missing.
host_network_netplan_id: "{{ host_network_wired_interface }}"
host_network_netplan_file: /etc/netplan/60-homelab-ethernet.yaml
# Wake-on-LAN on the wired port: the laptop powers on when the control node sends a magic packet after
# the power returns (issue #23, ADR 018). The BIOS setting and the cable are still needed.
host_network_wake_on_lan: true
# Fixed IPv4 address for the wired port, as a CIDR ("192.168.1.13/24"). Empty keeps DHCP. The control node
# pings this address after a power cut (ADR 018), so it must not change. Keep it outside the router's DHCP
# range, or two devices may get the same address. Set it in ansible/inventory/local.yaml, not in the repo.
host_network_static_address: ""
host_network_static_gateway: ""
# DNS servers for the fixed address; empty uses the gateway.
host_network_static_nameservers: []
# NetworkManager wifi.powersave: 2 = disable, 3 = enable (what the laptop had).
host_network_wifi_powersave: 2
host_network_wifi_conf_file: /etc/NetworkManager/conf.d/homelab-wifi-powersave.conf
# A change that cannot be verified in time is undone by a transient timer after this many seconds.
host_network_rollback_seconds: 180
host_network_rollback_script: /usr/local/sbin/homelab-host-network-rollback
host_network_state_dir: /var/lib/homelab-host-network
