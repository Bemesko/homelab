argument_specs:
  main:
    short_description: Syncthing on the NAS (an exception to "Ansible does not change the NAS"; ADR 011)
    options:
      nas_syncthing_version:
        description: Version of the syncthing package (set in group_vars/all)
        type: str
        required: true
      nas_syncthing_deb_sha256:
        description: sha256 of the syncthing_<version>_amd64.deb published in the GitHub release
        type: str
        required: true
      nas_syncthing_home:
        description: >-
          State directory (config, keys, index) on the NAS data disk,
          off the system USB stick (set in ansible/inventory/local.yaml)
        type: str
        required: true
      nas_syncthing_user:
        type: str
        default: Bernardo
      nas_syncthing_group:
        type: str
        default: users
      nas_syncthing_legacy_home:
        type: str
        default: /root/.local/state/syncthing
      nas_syncthing_gui_address:
        type: str
        default: 127.0.0.1:8384
      nas_syncthing_options:
        description: Fields of /rest/config/options that are applied (the others stay as they are)
        type: dict
        default: {}
      nas_syncthing_devices:
        description: >-
          Remote devices. This is the complete list: devices that are not here are
          removed (the NAS itself never is).
        type: list
        elements: dict
        default: []
        options:
          id:
            type: str
            required: true
          name:
            type: str
            required: true
      nas_syncthing_folders:
        description: >-
          Managed folders. Folders outside the list are not deleted, they only
          show up in a warning.
        type: list
        elements: dict
        default: []
        options:
          id:
            type: str
            required: true
          label:
            type: str
            required: true
          path:
            type: str
            required: true
          devices:
            description: IDs of the devices that share the folder (the NAS joins on its own)
            type: list
            elements: str
            required: true
