# User that owns the vault on the NAS (the same uid/gid as the NFS exports' all_squash).
nas_syncthing_user: Bernardo
nas_syncthing_group: users
# Old install (ran as root, state on the USB stick): source for migrating
# the identity (cert/key), so the device ID does not change.
nas_syncthing_legacy_home: /root/.local/state/syncthing
# GUI/API on loopback only; access through an SSH tunnel (see the README).
nas_syncthing_gui_address: 127.0.0.1:8384
# Subset of /rest/config/options applied by the role.
nas_syncthing_options:
  startBrowser: false
  urAccepted: -1
  globalAnnounceEnabled: true
  relaysEnabled: true
nas_syncthing_devices: []
nas_syncthing_folders: []
