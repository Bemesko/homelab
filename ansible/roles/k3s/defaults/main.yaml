k3s_tls_sans: "{{ ([tailscale_check_dns_name] + tailscale_check_ips) if (tailscale_enabled | bool) else [] }}"
k3s_install_script: "/usr/local/lib/k3s-install-{{ k3s_version }}.sh"
# registries.yaml with ghcr.io auth only when there is a token in the secrets (ansible/secrets).
k3s_ghcr_auth_enabled: "{{ ghcr_pull_token | default('') | length > 0 }}"
# `mirrors` section of registries.yaml, used only without the ghcr.io token. Empty everywhere but in CI.
k3s_registry_mirrors: {}
# The node IP is the first IPv4 tailnet address, so it does not change when the default route moves
# between the wired port and Wi-Fi (ADR 017). Empty when Tailscale is off (CI).
k3s_node_ip: "{{ ((tailscale_check_ips | default([]) | select('match', '^[0-9.]+$') | list | first) | default('')) if (tailscale_enabled | bool) else '' }}"
