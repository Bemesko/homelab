# Handlers run in the order of this file, so the unit files are reloaded before k3s restarts.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart k3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: not ansible_check_mode or k3s_installed_version | default('') | length > 0
