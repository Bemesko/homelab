- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_version_output
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record the installed version
  ansible.builtin.set_fact:
    k3s_installed_version: >-
      {{ (k3s_version_output.rc == 0)
         | ternary(k3s_version_output.stdout | default('') | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+'), '') }}

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# The node IP must be an address the node really has, or k3s would start with a wrong one (ADR 017).
- name: Ensure the tailnet address for the node IP is known
  ansible.builtin.assert:
    that:
      - k3s_node_ip | length > 0
    fail_msg: No IPv4 tailnet address was found for the k3s node IP. Check that Tailscale is running.
  when: tailscale_enabled | bool

- name: Configure k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

# k3s starts after the Tailscale daemon, so that the node IP exists at boot (ADR 017).
# Restart=always in the k3s unit covers the rare case where the address is still not there.
- name: Create the k3s unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tailscale_enabled | bool

- name: Order k3s after the Tailscale daemon
  ansible.builtin.template:
    src: k3s-after-tailscale.conf.j2
    dest: /etc/systemd/system/k3s.service.d/10-after-tailscale.conf
    owner: root
    group: root
    mode: "0644"
  when: tailscale_enabled | bool
  notify:
    - Reload systemd
    - Restart k3s

- name: Remove the k3s ordering drop-in when Tailscale is off
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d/10-after-tailscale.conf
    state: absent
  when: not (tailscale_enabled | bool)
  notify:
    - Reload systemd
    - Restart k3s

# Pulls the private GHCR images (the org's external apps) without an imagePullSecret per app.
# Without a token in the secrets (CI), the file does not exist.
- name: Configure the ghcr.io credential in k3s
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (homelab)
      configs:
        ghcr.io:
          auth:
            username: {{ ghcr_pull_username | to_json }}
            password: {{ ghcr_pull_token | to_json }}
  no_log: true
  when: k3s_ghcr_auth_enabled | bool
  notify: Restart k3s

- name: Remove the ghcr.io credential from k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s/registries.yaml
    state: absent
  when: not (k3s_ghcr_auth_enabled | bool)
  notify: Restart k3s

- name: Download the k3s installer (pinned version and checksum)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
    dest: "{{ k3s_install_script }}"
    checksum: "sha256:{{ k3s_install_script_sha256 }}"
    mode: "0755"

# The installer also validates the binary's sha256 against the k3s release.
- name: Install k3s
  ansible.builtin.command: "{{ k3s_install_script }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: k3s_installed_version != k3s_version
  changed_when: true

- name: Flush pending handlers before using the cluster
  ansible.builtin.meta: flush_handlers

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode or k3s_installed_version | length > 0

# After a restart the API server can refuse connections or answer 503 "starting" for a few
# seconds (on 2026-11-23 the local endpoint was reconfigured when the node IP changed, ADR 017).
# Everything after this role talks to the API, so wait until it reports ready.
- name: Wait for the API server to be ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_readyz
  changed_when: false
  check_mode: false
  retries: 60
  delay: 5
  until: k3s_readyz.rc == 0 and k3s_readyz.stdout == 'ok'
  when: not ansible_check_mode or k3s_installed_version | length > 0

- name: Wait for the node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or k3s_installed_version | length > 0
