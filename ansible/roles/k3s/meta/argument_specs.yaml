argument_specs:
  main:
    short_description: Installs and configures single-node k3s
    options:
      k3s_version:
        type: str
        required: true
      k3s_install_script_sha256:
        type: str
        required: true
      tailscale_enabled:
        type: bool
        required: true
      k3s_registry_mirrors:
        description: The `mirrors` section of registries.yaml; ignored when there is a ghcr.io token
        type: dict
        default: {}
      ghcr_pull_username:
        description: GitHub user that owns the GHCR pull PAT
        type: str
        default: ""
      ghcr_pull_token:
        description: Classic PAT with only read:packages (empty = no registries.yaml, as in CI)
        type: str
        default: ""
        no_log: true
