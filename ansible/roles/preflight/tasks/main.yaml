- name: Ensure a supported Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in preflight_supported_ubuntu_versions
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Host is {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      ({{ ansible_facts['architecture'] }}); supported: Ubuntu {{ preflight_supported_ubuntu_versions | join(', ') }} x86_64.

- name: Ensure the connection is not made as root
  ansible.builtin.assert:
    that:
      - (ansible_user | default(lookup('ansible.builtin.env', 'USER'))) != 'root'
    fail_msg: Connect with a regular user and use become (sudo).

- name: Ensure the host is on the tailnet
  ansible.builtin.assert:
    that:
      - "'tailscale0' in ansible_facts['interfaces']"
    fail_msg: Interface tailscale0 missing; the playbook does not install or configure the host's Tailscale.
  when: tailscale_enabled | bool

- name: Read the host firewall state (read-only)
  ansible.builtin.command: ufw status # lockout-safe: read-only
  register: preflight_firewall
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn if the host firewall is active
  ansible.builtin.debug:
    msg: >-
      The host firewall is active. The playbook does NOT change it; if pods cannot reach the API,
      allow 10.42.0.0/16 and 10.43.0.0/16 manually (see the README).
  when: "'Status: active' in preflight_firewall.stdout"
