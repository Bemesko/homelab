# Accepted key types (OpenSSH public key algorithms; sk-* are hardware-backed keys such as a YubiKey).
control_node_access_key_types: 'ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh[.]com|sk-ecdsa-sha2-nistp256@openssh[.]com'
# Full line: key type, base64 body, optional comment. Anything before the type (options such as command= or from=) is rejected.
control_node_access_key_pattern: "^({{ control_node_access_key_types }}) [A-Za-z0-9+/]+={0,2}( .*)?$"
