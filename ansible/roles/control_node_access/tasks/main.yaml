# The only exception to the no-lockout rule (issue #32): it ADDS public keys for the
# control node and never removes keys nor touches the SSH server configuration.
- name: Ensure every control node key is a well-formed public key
  ansible.builtin.assert:
    that:
      # TODO(human): tighten this check (accepted key types, single line, no options prefix).
      - item is string
      - item | length > 0
    fail_msg: "Invalid public key in control_node_access_public_keys: {{ item | truncate(40) }}"
    quiet: true
  loop: "{{ control_node_access_public_keys }}"

- name: Ensure ~/.ssh exists for the connection user
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Add the control node keys (append only)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/authorized_keys" # lockout-safe: append-only
    line: "{{ item }}"
    create: true
    mode: "0600"
  loop: "{{ control_node_access_public_keys }}"
