argument_specs:
  main:
    short_description: Adds the control node's public SSH keys to the connection user's key list (add only)
    options:
      control_node_access_public_keys:
        type: list
        elements: str
        required: true
        description: One public key per entry (e.g. "ssh-ed25519 AAAA... pi"); never removed by this role.
