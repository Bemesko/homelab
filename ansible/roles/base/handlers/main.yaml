- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

# Replacing (-r) the loaded profile also updates the running containers.
- name: Reload the containers' AppArmor profile
  ansible.builtin.command: apparmor_parser --replace /etc/apparmor.d/cri-containerd.apparmor.d
  changed_when: true
