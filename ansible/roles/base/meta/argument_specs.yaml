argument_specs:
  main:
    short_description: Packages, sysctl and helm on the host
    options:
      helm_version:
        type: str
        required: true
      helm_sha256:
        type: str
        required: true
      base_packages:
        type: list
        elements: str
        default: [curl, jq, nfs-common, python3-kubernetes, python3-yaml]
