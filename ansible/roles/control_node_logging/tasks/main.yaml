# Every `make plan/apply` on the control node is also written to the journal as `homelab-ansible`
# (the Makefile tees it), so a copy stays on the Pi even when the cluster is down. The host
# collector forwards that identifier to Loki (see group_vars/control_node.yaml).
- name: Keep the journal on disk, capped for the SD card and log2ram
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-control-node.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ control_node_logging_journal_max_use }}
  notify: Restart systemd-journald

- name: Ensure the journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Look up the owner's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ control_node_logging_user }}"

- name: Remember the Ansible log path
  ansible.builtin.set_fact:
    control_node_logging_ansible_log_path: "{{ ansible_facts['getent_passwd'][control_node_logging_user][4] }}/{{ control_node_logging_ansible_log }}"

- name: Ensure the Ansible log directory exists
  ansible.builtin.file:
    path: "{{ control_node_logging_ansible_log_path | dirname }}"
    state: directory
    mode: "0755"
  become: false

- name: Rotate the Ansible log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/homelab-ansible
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ control_node_logging_ansible_log_path }} {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          copytruncate
      }
