# Read-only: Tailscale is the access channel to the laptop, so this role
# never changes the daemon or its configuration.
- name: Read the Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_check_raw
  changed_when: false
  check_mode: false

- name: Parse the Tailscale status
  ansible.builtin.set_fact:
    tailscale_check_status: "{{ tailscale_check_raw.stdout | from_json }}"

- name: Ensure Tailscale is logged in and running
  ansible.builtin.assert:
    that:
      - tailscale_check_status.BackendState == 'Running'
      - tailscale_check_status.Self.DNSName | length > 0
    fail_msg: Tailscale is not in the Running state on this host.

- name: Expose the host's MagicDNS name and IPs
  ansible.builtin.set_fact:
    tailscale_check_dns_name: "{{ tailscale_check_status.Self.DNSName | regex_replace('\\.$', '') }}"
    tailscale_check_ips: "{{ tailscale_check_status.Self.TailscaleIPs }}"
