# Incident of 2026-11-11 (ADR 010): unattended-upgrades ran at a random time,
# installed a kernel (initramfs + NVIDIA modules) and saturated the SSD; the Grafana and
# k3s (kine) SQLite databases stalled for ~7 min.
- name: Check whether unattended-upgrades and the apt timers exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/unattended-upgrade
    - /usr/lib/systemd/system/apt-daily-upgrade.timer
  register: os_updates_present

- name: Record what exists on this host
  ansible.builtin.set_fact:
    os_updates_has_unattended: "{{ os_updates_present.results[0].stat.exists }}"
    os_updates_has_timers: "{{ os_updates_present.results[1].stat.exists }}"

- name: Take the kernel out of unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (homelab), role os_updates. See ADR 010.
      // Kernel only through `make kernel-upgrade` (installs, reboots and validates the cluster).
      Unattended-Upgrade::Package-Blacklist { {{ os_updates_blacklist | map('to_json') | join('; ') }}; };
      // The previous kernel stays as a fallback; make kernel-upgrade removes it.
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
  when: os_updates_has_unattended

- name: Create the apt drop-in directories in systemd
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily-upgrade.service
  when: os_updates_has_timers

- name: Pin the apt timer schedule (no random delay)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/10-homelab.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (homelab), role os_updates. See ADR 010.
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ item.time }}
      RandomizedDelaySec=0
  loop:
    - {unit: apt-daily.timer, time: "{{ os_updates_download_time }}"}
    - {unit: apt-daily-upgrade.timer, time: "{{ os_updates_upgrade_time }}"}
  loop_control:
    label: "{{ item.unit }} {{ item.time }}"
  when: os_updates_has_timers
  notify: Reload the apt timers

- name: Run the upgrade with the lowest CPU and I/O priority
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.service.d/10-homelab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (homelab), role os_updates. See ADR 010.
      # dpkg inherits the priority: it only uses disk/CPU when the cluster is not using them.
      [Service]
      Nice=19
      CPUSchedulingPolicy=idle
      IOSchedulingClass=idle
  when: os_updates_has_timers
  notify: Reload the apt timers

- name: Apply the drop-ins before checking
  ansible.builtin.meta: flush_handlers

- name: Read the effective schedule of apt-daily-upgrade.timer
  # The systemd_service module does not expose TimersCalendar; it is read-only.
  ansible.builtin.command: systemctl show apt-daily-upgrade.timer --property=TimersCalendar --value # noqa: command-instead-of-module
  register: os_updates_timer_calendar
  changed_when: false
  check_mode: false
  when: os_updates_has_timers

- name: Ensure the timer only uses the fixed schedule
  ansible.builtin.assert:
    that:
      - os_updates_timer_calendar.stdout is search(os_updates_upgrade_time ~ ':00')
      - os_updates_timer_calendar.stdout_lines | length == 1
    fail_msg: "apt-daily-upgrade.timer: {{ os_updates_timer_calendar.stdout }}"
  when: os_updates_has_timers and not ansible_check_mode

- name: Read the effective unattended-upgrades blacklist
  ansible.builtin.command: apt-config dump Unattended-Upgrade::Package-Blacklist
  register: os_updates_blacklist_effective
  changed_when: false
  check_mode: false
  when: os_updates_has_unattended

- name: Ensure the blacklist was applied
  ansible.builtin.assert:
    that:
      - (item | to_json) in os_updates_blacklist_effective.stdout
  loop: "{{ os_updates_blacklist }}"
  when: os_updates_has_unattended and not ansible_check_mode
