# SIGHUP faz o logind reler a configuração sem reiniciar: sessões (SSH e gráfica) continuam.
- name: Recarregar systemd-logind
  ansible.builtin.command: systemctl kill --kill-whom=main --signal=SIGHUP systemd-logind.service
  changed_when: true

- name: Atualizar banco do dconf
  ansible.builtin.command: dconf update
  changed_when: true

- name: Reiniciar upower
  ansible.builtin.systemd_service:
    name: upower.service
    state: restarted
  when: not ansible_check_mode

- name: Recarregar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Reiniciar guardião de energia
  ansible.builtin.systemd_service:
    name: homelab-power-guard.service
    state: restarted
  when: not ansible_check_mode
