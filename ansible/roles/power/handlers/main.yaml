# SIGHUP makes logind re-read its configuration without restarting: sessions (SSH and graphical) stay up.
- name: Reload systemd-logind
  ansible.builtin.command: systemctl kill --kill-whom=main --signal=SIGHUP systemd-logind.service
  changed_when: true

- name: Update the dconf database
  ansible.builtin.command: dconf update
  changed_when: true

- name: Restart upower
  ansible.builtin.systemd_service:
    name: upower.service
    state: restarted
  when: not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart the power guard
  ansible.builtin.systemd_service:
    name: homelab-power-guard.service
    state: restarted
  when: not ansible_check_mode
