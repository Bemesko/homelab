argument_specs:
  main:
    short_description: Laptop as a server (ADR 012) — never suspends, shuts down on low battery and powers back on through the RTC
    options:
      power_lid_switch:
        type: str
        choices: [ignore, lock, poweroff]
        default: ignore
        description: logind action when the lid closes (on AC, on battery and docked).
      power_shutdown_percent:
        type: int
        default: 10
        description: On battery, shut down when reaching this percentage.
      power_rtc_wake_interval:
        type: int
        default: 1800
        description: Seconds until the RTC powers back on after a low-battery shutdown (0 disables).
