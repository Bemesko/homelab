# Notebooks como servidores (ADR 012, issue #15): fechar a tampa nunca suspende,
# nem na bateria. Quem decide desligar é o homelab-power-guard.
power_lid_switch: ignore

# Na bateria, desliga ao chegar neste percentual (sem energia externa).
power_shutdown_percent: 10

# Ao desligar pela bateria, arma o RTC para religar a cada N segundos e conferir se a
# energia voltou (0 desliga). Depende do BIOS acordar de S5 pelo RTC.
power_rtc_wake_interval: 1800
