# Laptops as servers (ADR 012, issue #15): closing the lid never suspends,
# not even on battery. The decision to shut down belongs to homelab-power-guard.
power_lid_switch: ignore

# On battery, shut down when reaching this percentage (no external power).
power_shutdown_percent: 10

# When shutting down on battery, arm the RTC to power back on every N seconds and check whether
# power is back (0 disables). Depends on the BIOS waking from S5 on the RTC.
power_rtc_wake_interval: 1800
