# Laptops as servers (ADR 012, issue #15). Runs on the cluster laptop and on the NAS.
# 1. Never suspend: lid ignored in logind, sleep targets masked, GNOME without
#    suspend on inactivity (which is what took the cluster down on 2026-11-13).
- name: Create the logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the old lid drop-in
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/90-k3s-lid.conf
    state: absent
  notify: Reload systemd-logind

- name: Configure the lid in logind (AC, battery and dock)
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/90-homelab-power.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (homelab), role power. See ADR 012.
      [Login]
      HandleLidSwitch={{ power_lid_switch }}
      HandleLidSwitchExternalPower={{ power_lid_switch }}
      HandleLidSwitchDocked={{ power_lid_switch }}
  notify: Reload systemd-logind

- name: Mask the suspend and hibernate targets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target

- name: Check whether the host has dconf (GNOME)
  ansible.builtin.stat:
    path: /usr/bin/dconf
  register: power_dconf

- name: Configure GNOME not to suspend on inactivity
  when: power_dconf.stat.exists
  block:
    - name: Create the dconf local database directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/dconf/profile
        - /etc/dconf/db/local.d/locks

    - name: Create the dconf user profile (if it does not exist yet)
      ansible.builtin.copy:
        dest: /etc/dconf/profile/user
        owner: root
        group: root
        mode: "0644"
        force: false
        content: |
          user-db:user
          system-db:local
      register: power_dconf_profile_created
      notify: Update the dconf database

    # A profile that already existed may not read the local database (copy does not overwrite it).
    # In check mode, a profile still to be created is not on disk yet.
    - name: Check an existing dconf user profile
      when: not (ansible_check_mode and power_dconf_profile_created is changed)
      block:
        - name: Read the dconf user profile
          ansible.builtin.slurp:
            src: /etc/dconf/profile/user
          register: power_dconf_profile

        - name: Ensure the profile reads the local database
          ansible.builtin.assert:
            that:
              - "'system-db:local' in (power_dconf_profile.content | b64decode)"
            fail_msg: "/etc/dconf/profile/user exists without system-db:local; fix it by hand."

    - name: Set the GNOME power defaults
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/90-homelab-power
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (homelab), role power. See ADR 012.
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-type='nothing'
      notify: Update the dconf database

    - name: Lock the GNOME power defaults
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/locks/90-homelab-power
        owner: root
        group: root
        mode: "0644"
        content: |
          /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
          /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
      notify: Update the dconf database

# 2. Shut down on low battery and power back on through the RTC (our own guard: the NAS has no
#    upower, and the laptop's upower only acts at 2% and would try HybridSleep).
- name: Check whether the host has the UPower config
  ansible.builtin.stat:
    path: /etc/UPower/UPower.conf
  register: power_upower_conf

- name: Make UPower power off (not hibernate) if the battery runs out
  ansible.builtin.lineinfile:
    path: /etc/UPower/UPower.conf
    regexp: '^CriticalPowerAction='
    line: CriticalPowerAction=PowerOff
  when: power_upower_conf.stat.exists
  notify: Restart upower

- name: Install the power guard
  ansible.builtin.copy:
    src: homelab-power-guard
    dest: /usr/local/sbin/homelab-power-guard
    owner: root
    group: root
    mode: "0755"
  notify: Restart the power guard

- name: Install the guard and boot-check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homelab-power-guard.service
    - homelab-power-gate.service
  notify:
    - Reload systemd
    - Restart the power guard

- name: Run the handlers before enabling the units
  ansible.builtin.meta: flush_handlers

- name: Enable the boot check
  ansible.builtin.systemd_service:
    name: homelab-power-gate.service
    enabled: true
  # In check mode the unit does not exist on the host yet.
  when: not ansible_check_mode

- name: Enable and start the power guard
  ansible.builtin.systemd_service:
    name: homelab-power-guard.service
    enabled: true
    state: started
  when: not ansible_check_mode

# Checks
- name: Read the effective logind configuration
  ansible.builtin.command: >-
    busctl get-property org.freedesktop.login1 /org/freedesktop/login1
    org.freedesktop.login1.Manager {{ item }}
  loop:
    - HandleLidSwitch
    - HandleLidSwitchExternalPower
    - HandleLidSwitchDocked
  register: power_logind_effective
  changed_when: false
  check_mode: false

- name: Read the state of the sleep targets
  ansible.builtin.command: systemctl is-enabled sleep.target suspend.target hibernate.target hybrid-sleep.target # noqa: command-instead-of-module
  register: power_sleep_targets
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure the lid is ignored and sleep is masked
  ansible.builtin.assert:
    that:
      - power_logind_effective.results | map(attribute='stdout') | unique | list == ['s "' ~ power_lid_switch ~ '"']
      - power_sleep_targets.stdout_lines | unique | list == ['masked']
    fail_msg: >-
      logind: {{ power_logind_effective.results | map(attribute='stdout') | list }};
      sleep targets: {{ power_sleep_targets.stdout_lines }}
  # In check mode the configuration has not been written or reloaded yet.
  when: not ansible_check_mode
