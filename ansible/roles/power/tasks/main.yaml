# Notebooks como servidores (ADR 012, issue #15). Roda no notebook do cluster e no NAS.
# 1. Nunca suspender: tampa ignorada no logind, alvos de sono mascarados, GNOME sem
#    suspensão por inatividade (foi o que derrubou o cluster em 2026-11-13).
- name: Criar diretório de drop-ins do logind
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remover o drop-in antigo da tampa
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/90-k3s-lid.conf
    state: absent
  notify: Recarregar systemd-logind

- name: Configurar a tampa no logind (tomada, bateria e dock)
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/90-homelab-power.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerenciado pelo Ansible (2026-kubernetes), role power. Veja o ADR 012.
      [Login]
      HandleLidSwitch={{ power_lid_switch }}
      HandleLidSwitchExternalPower={{ power_lid_switch }}
      HandleLidSwitchDocked={{ power_lid_switch }}
  notify: Recarregar systemd-logind

- name: Mascarar os alvos de suspensão e hibernação
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target

- name: Verificar se o host tem dconf (GNOME)
  ansible.builtin.stat:
    path: /usr/bin/dconf
  register: power_dconf

- name: Configurar o GNOME para não suspender por inatividade
  when: power_dconf.stat.exists
  block:
    - name: Criar diretórios do banco local do dconf
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/dconf/profile
        - /etc/dconf/db/local.d/locks

    - name: Criar o perfil de usuário do dconf (se ainda não existe)
      ansible.builtin.copy:
        dest: /etc/dconf/profile/user
        owner: root
        group: root
        mode: "0644"
        force: false
        content: |
          user-db:user
          system-db:local
      register: power_dconf_profile_created
      notify: Atualizar banco do dconf

    # Um perfil que já existia pode não ler o banco local (o copy não o sobrescreve).
    # Em check mode, um perfil a criar ainda não está no disco.
    - name: Conferir um perfil de usuário do dconf já existente
      when: not (ansible_check_mode and power_dconf_profile_created is changed)
      block:
        - name: Ler o perfil de usuário do dconf
          ansible.builtin.slurp:
            src: /etc/dconf/profile/user
          register: power_dconf_profile

        - name: Garantir que o perfil lê o banco local
          ansible.builtin.assert:
            that:
              - "'system-db:local' in (power_dconf_profile.content | b64decode)"
            fail_msg: "/etc/dconf/profile/user existe sem system-db:local; ajuste à mão."

    - name: Definir os padrões de energia do GNOME
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/90-homelab-power
        owner: root
        group: root
        mode: "0644"
        content: |
          # Gerenciado pelo Ansible (2026-kubernetes), role power. Veja o ADR 012.
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-type='nothing'
      notify: Atualizar banco do dconf

    - name: Travar os padrões de energia do GNOME
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/locks/90-homelab-power
        owner: root
        group: root
        mode: "0644"
        content: |
          /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
          /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
      notify: Atualizar banco do dconf

# 2. Desligar com bateria baixa e religar pelo RTC (guardião próprio: o NAS não tem
#    upower, e o upower do notebook só age em 2% e tentaria HybridSleep).
- name: Verificar se o host tem a configuração do UPower
  ansible.builtin.stat:
    path: /etc/UPower/UPower.conf
  register: power_upower_conf

- name: Fazer o UPower desligar (não hibernar) se a bateria esgotar
  ansible.builtin.lineinfile:
    path: /etc/UPower/UPower.conf
    regexp: '^CriticalPowerAction='
    line: CriticalPowerAction=PowerOff
  when: power_upower_conf.stat.exists
  notify: Reiniciar upower

- name: Instalar o guardião de energia
  ansible.builtin.copy:
    src: homelab-power-guard
    dest: /usr/local/sbin/homelab-power-guard
    owner: root
    group: root
    mode: "0755"
  notify: Reiniciar guardião de energia

- name: Instalar as units do guardião e da checagem de boot
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homelab-power-guard.service
    - homelab-power-gate.service
  notify:
    - Recarregar systemd
    - Reiniciar guardião de energia

- name: Aplicar os handlers antes de habilitar as units
  ansible.builtin.meta: flush_handlers

- name: Habilitar a checagem de boot
  ansible.builtin.systemd_service:
    name: homelab-power-gate.service
    enabled: true
  # Em check mode a unit ainda não existe no host.
  when: not ansible_check_mode

- name: Habilitar e iniciar o guardião de energia
  ansible.builtin.systemd_service:
    name: homelab-power-guard.service
    enabled: true
    state: started
  when: not ansible_check_mode

# Verificações
- name: Ler a configuração efetiva do logind
  ansible.builtin.command: >-
    busctl get-property org.freedesktop.login1 /org/freedesktop/login1
    org.freedesktop.login1.Manager {{ item }}
  loop:
    - HandleLidSwitch
    - HandleLidSwitchExternalPower
    - HandleLidSwitchDocked
  register: power_logind_effective
  changed_when: false
  check_mode: false

- name: Ler o estado dos alvos de sono
  ansible.builtin.command: systemctl is-enabled sleep.target suspend.target hibernate.target hybrid-sleep.target # noqa: command-instead-of-module
  register: power_sleep_targets
  changed_when: false
  failed_when: false
  check_mode: false

- name: Garantir tampa ignorada e sono mascarado
  ansible.builtin.assert:
    that:
      - power_logind_effective.results | map(attribute='stdout') | unique | list == ['s "' ~ power_lid_switch ~ '"']
      - power_sleep_targets.stdout_lines | unique | list == ['masked']
    fail_msg: >-
      logind: {{ power_logind_effective.results | map(attribute='stdout') | list }};
      alvos de sono: {{ power_sleep_targets.stdout_lines }}
  # Em check mode a configuração ainda não foi gravada nem recarregada.
  when: not ansible_check_mode
