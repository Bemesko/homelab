# Copy to ansible/inventory/local.yaml (ignored by git) and fill it in.
# Use the short MagicDNS name, not the *.ts.net FQDN.
all:
  children:
    k3s_server:
      hosts:
        notebook:
          ansible_host: <magicdns-hostname>
          ansible_user: <user>
          # NAS (openmediavault) with the Immich NFS exports; see the README.
          # They live on the host, not in the group `vars:`: inventory group variables
          # lose to ansible/group_vars/all (where the default is false).
          nas_storage_enabled: true
          nas_storage_host: <nas-magicdns-hostname>
          nas_storage_exports:
            photos: </export/photos>
            data: </export/immich-data>
            obsidian: </export/borbsidian>
            home_assistant: </export/home-assistant>
            backups: </export/cnpg-backups>
          # Wired-first network: DHCP on the Ethernet port, Wi-Fi power saving off, rollback on failure (ADR 017).
          host_network_enabled: true
          # Optional fixed LAN address for the wired port (ADR 018). Keep it outside the router's DHCP range,
          # and use the same address in wol_sender_address below. Leave both out to keep DHCP.
          host_network_static_address: <lan-ip>/24
          host_network_static_gateway: <router-ip>
          # OpenTelemetry Collector on the host (journald + metrics) -> cluster gateway.
          otel_host_agent_enabled: true
          otel_host_agent_endpoint: <gateway-magicdns-name>:4317
          # Wake-on-LAN (issue #23, ADR 018): the wired MAC and the LAN address the control node pings.
          wol_sender_mac: <wired-mac-aa:bb:cc:dd:ee:ff>
          wol_sender_address: <lan-ip>
    # Control node (Raspberry Pi 3B, issue #32): runs `make control-node` by hand.
    control_node:
      hosts:
        control:
          ansible_host: <control-node-magicdns-hostname>
          ansible_user: <user>
          # Sends the Wake-on-LAN packets after a boot (issue #23, ADR 018).
          wol_sender_enabled: true
    # NAS: Ansible only manages Syncthing (ADR 011) and power (ADR 012); the rest is done in the OMV UI.
    nas:
      hosts:
        nas:
          ansible_host: <nas-magicdns-hostname>
          ansible_user: root
          nas_syncthing_enabled: true
          # Lid, sleep and battery guard (ADR 012).
          nas_power_enabled: true
          # Wake-on-LAN (issue #23, ADR 018): the wired MAC and the LAN address the control node pings.
          wol_sender_mac: <wired-mac-aa:bb:cc:dd:ee:ff>
          wol_sender_address: <lan-ip>
          # State (config, keys, index) on the data disk, off the USB stick.
          nas_syncthing_home: </srv/dev-disk-by-uuid-.../appdata/syncthing>
          # Complete list: devices not in it are removed.
          nas_syncthing_devices:
            - id: <PHONE-DEVICE-ID>
              name: <name>
          nas_syncthing_folders:
            - id: <folder-id>
              label: <label>
              path: </srv/dev-disk-by-uuid-.../path/to/vault>
              devices: [<PHONE-DEVICE-ID>]
