# OpenTelemetry Collector of the NAS (openmediavault). It is NOT applied by Ansible:
# paste this whole file into the OMV compose plugin (Services -> Compose -> Files).
# The configuration is embedded (configs.content): nothing to copy over SMB.
# Host metrics (via /hostfs), disk SMART (smartctl-exporter), the OMV syslog
# and the OMV Rsync task log -> the cluster OTLP gateway on the tailnet ("otel",
# resolved by MagicDNS). service.name=nas-host becomes job in Prometheus and
# service_name in Loki; the "NAS without metrics" alert depends on it. The rsync log goes
# as service_name=nas-rsync, which Loki keeps for 30 days (replica history).
# Literal "$" in the embedded config are "$$" (compose interpolates ${...}).
services:
  smartctl-exporter:
    # yamllint disable-line rule:line-length
    image: prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    container_name: smartctl-exporter
    restart: unless-stopped
    # smartctl talks directly to the disks (ATA pass-through, including the SSD in the
    # USB case via -d sat): it needs privileged and root. Reads SMART only; it listens on localhost
    # and the otel-collector scrapes it.
    privileged: true
    user: root
    network_mode: host
    mem_limit: 64m
    command:
      - --web.listen-address=127.0.0.1:9633
      - --smartctl.interval=300s


  otel-collector:
    # yamllint disable-line rule:line-length
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    container_name: otel-collector
    restart: unless-stopped
    # Host: reads the interfaces and receives the NAS's own syslog on 127.0.0.1.
    network_mode: host
    # No read_only: Compose writes configs.content into the container on creation
    # ("`file` is the sole supported option" on a read-only service). The container
    # layer lives on the SSD (Docker storage), and the exporter queue is in memory only.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # adm group (gid 4 on Debian): reads /var/log/rsync.log (root:adm 0640).
    group_add: ["4"]
    mem_limit: 256m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel-config
        target: /etc/otelcol-contrib/config.yaml
    volumes:
      - /:/hostfs:ro

configs:
  otel-config:
    # Compose interpolates ${...}: OTEL_GATEWAY can come from the stack's .env.
    content: |
      receivers:
        hostmetrics:
          root_path: /hostfs
          collection_interval: 30s
          scrapers:
            cpu: {}
            load: {}
            memory: {}
            paging: {}
            disk: {}
            network: {}
            filesystem:
              exclude_fs_types:
                fs_types: [autofs, cgroup2, devtmpfs, nsfs, overlay, proc, squashfs, sysfs, tmpfs, tracefs]
                match_type: strict
        # OMV forwards the syslog here (Diagnostics -> System Logs -> Remote:
        # host 127.0.0.1, port 5140, TCP).
        syslog:
          tcp:
            listen_address: 127.0.0.1:5140
          protocol: rfc3164
          location: America/Sao_Paulo
        # Disk SMART (smartctl-exporter service above). 5 min is enough: wear and
        # error attributes change slowly.
        prometheus/smart:
          config:
            scrape_configs:
              - job_name: smartctl
                scrape_interval: 5m
                static_configs:
                  - targets: [127.0.0.1:9633]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: smartctl_device|smartctl_device_(attribute|smart_status|temperature|smartctl_exit_status)
                    action: keep
        # Log of the OMV Rsync tasks (--log-file=/var/log/rsync.log, on tmpfs through
        # writecache). One line per event: "YYYY/MM/DD hh:mm:ss [pid] message".
        # start_at end: with no on-disk storage (USB stick), a restart loses at most
        # the lines written while the collector was stopped.
        file_log/rsync:
          include: [/hostfs/var/log/rsync.log]
          start_at: end
          operators:
            - type: regex_parser
              regex: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<rsync_pid>\d+)\] (?P<rsync_msg>.*)$$'
              on_error: send_quiet
              timestamp:
                parse_from: attributes.time
                layout_type: strptime
                layout: '%Y/%m/%d %H:%M:%S'
                location: America/Sao_Paulo
            - type: remove
              field: attributes.time
              on_error: send_quiet

      processors:
        memory_limiter:
          check_interval: 5s
          limit_mib: 200
        resourcedetection:
          detectors: [system]
          system:
            hostname_sources: [os]
        resource:
          attributes:
            - key: service.name
              value: nas-host
              action: upsert
        # Role of each disk (nas_role label) for the capacity alerts in
        # base/alerts/nas.yaml. The mountpoints (/srv/dev-disk-by-uuid-...) come from the
        # stack's .env, NAS_PRIMARY_MOUNT and NAS_REPLICA_MOUNT; without them nothing matches.
        transform/nas_role:
          error_mode: ignore
          metric_statements:
            - statements:
                - set(datapoint.attributes["nas_role"], "primary") where datapoint.attributes["mountpoint"] == "${NAS_PRIMARY_MOUNT:-}"
                - set(datapoint.attributes["nas_role"], "replica") where datapoint.attributes["mountpoint"] == "${NAS_REPLICA_MOUNT:-}"
        resource/rsync:
          attributes:
            - key: service.name
              value: nas-rsync
              action: upsert
        # Classifies the rsync lines (rsync_event attribute, structured metadata in
        # Loki) and extracts the numbers from the summaries, without the thousands commas:
        #   "sent X bytes  received Y bytes  Z bytes/sec" -> stats (+ estimated duration)
        #   "total size is N  speedup is S"                -> summary (successful end)
        transform/rsync:
          error_mode: ignore
          # Long statements are split over lines: YAML joins the string with spaces.
          log_statements:
            - statements:
                - 'set(log.attributes["rsync_event"], "start") where log.attributes["rsync_msg"] == "building file list"'
                - 'set(log.attributes["rsync_event"], "transfer") where IsMatch(log.attributes["rsync_msg"], "^[<>c][fLDS]")'
                - 'set(log.attributes["rsync_event"], "attrs") where IsMatch(log.attributes["rsync_msg"], "^\\.[fdLDS]")'
                - 'set(log.attributes["rsync_event"], "delete") where IsMatch(log.attributes["rsync_msg"], "^\\*deleting")'
                - 'set(log.attributes["rsync_event"], "error") where IsMatch(log.attributes["rsync_msg"], "^rsync error")'
                - 'set(log.attributes["rsync_event"], "warning") where IsMatch(log.attributes["rsync_msg"], "^rsync warning")'
                - 'merge_maps(log.attributes, ExtractPatterns(log.attributes["rsync_msg"],
                  "\\(code (?P<rsync_exit_code>[0-9]+)\\)"), "upsert")
                  where log.attributes["rsync_event"] == "error" or log.attributes["rsync_event"] == "warning"'
                - 'set(log.attributes["rsync_event"], "stats") where IsMatch(log.attributes["rsync_msg"], "^sent [0-9,]+ bytes")'
                - 'merge_maps(log.attributes, ExtractPatterns(log.attributes["rsync_msg"],
                  "^sent (?P<rsync_sent_bytes>[0-9,]+) bytes +received (?P<rsync_received_bytes>[0-9,]+) bytes +(?P<rsync_rate>[0-9,.]+) bytes/sec"),
                  "upsert") where log.attributes["rsync_event"] == "stats"'
                - 'set(log.attributes["rsync_event"], "summary") where IsMatch(log.attributes["rsync_msg"], "^total size is ")'
                - 'merge_maps(log.attributes, ExtractPatterns(log.attributes["rsync_msg"],
                  "^total size is (?P<rsync_total_size_bytes>[0-9,]+)"), "upsert")
                  where log.attributes["rsync_event"] == "summary"'
                - 'replace_pattern(log.attributes["rsync_sent_bytes"], ",", "") where log.attributes["rsync_sent_bytes"] != nil'
                - 'replace_pattern(log.attributes["rsync_received_bytes"], ",", "") where log.attributes["rsync_received_bytes"] != nil'
                - 'replace_pattern(log.attributes["rsync_rate"], ",", "") where log.attributes["rsync_rate"] != nil'
                - 'replace_pattern(log.attributes["rsync_total_size_bytes"], ",", "") where log.attributes["rsync_total_size_bytes"] != nil'
                # rsync computes bytes/sec = (sent + received) / total time.
                - 'set(log.attributes["rsync_duration_seconds"],
                  Int((Double(log.attributes["rsync_sent_bytes"]) + Double(log.attributes["rsync_received_bytes"]))
                  / Double(log.attributes["rsync_rate"])))
                  where log.attributes["rsync_event"] == "stats" and log.attributes["rsync_rate"] != "0.00"'
                # The message already is the log body.
                - 'delete_key(log.attributes, "rsync_msg")'
        batch: {}

      exporters:
        otlp:
          endpoint: ${OTEL_GATEWAY:-otel:4317}
          # Traffic already encrypted by the tailnet's WireGuard.
          tls:
            insecure: true
          # In memory: the NAS cannot take continuous writes to the USB stick.
          sending_queue:
            enabled: true
            queue_size: 500

      service:
        telemetry:
          metrics:
            level: none
        pipelines:
          metrics:
            receivers: [hostmetrics, prometheus/smart]
            processors: [memory_limiter, resourcedetection, resource, transform/nas_role, batch]
            exporters: [otlp]
          logs:
            receivers: [syslog]
            processors: [memory_limiter, resourcedetection, resource, batch]
            exporters: [otlp]
          logs/rsync:
            receivers: [file_log/rsync]
            processors: [memory_limiter, resourcedetection, resource/rsync, transform/rsync, batch]
            exporters: [otlp]
